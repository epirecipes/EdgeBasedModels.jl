- id: Docs.cf.ambientODE
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 56-58
  text: Both **Node** and **Edge** embed in the category **ODE** of smooth dynamical systems on compact
    manifolds with corners, with semi-conjugacies as morphisms.
- id: Docs.cf.coarseGrainDef
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 64-75
  text: |-
    Given an EBCM object (θ, φ, R, ψ), define F on objects by:
    [...]
    F(θ, φ, R, ψ) = (S, I, R) where S_l = ψ_l(θ_{1l}, …, θ_{Kl}) (evaluate PGF at θ-vector) R_l = R_l (identity) I_l = 1 - S_l - R_l (derived)
    [...]
    On morphisms, F is not yet defined: the formula ψ ∘ h ∘ ψ^{-1} does not type-check in general (h acts on (θ, φ, R), ψ only on θ), so F is a map on objects only.
- id: Docs.cf.prop3_1
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 79-81
  text: '**Proposition 3.1.** F preserves the ODE structure: if (θ(t), φ(t), R(t)) solves the EBCM system,
    then (S(t), I(t), R(t)) := F(θ(t), φ(t), R(t)) satisfies a closed ODE system on the simplex.'
- id: Docs.cf.thm3_2
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 94-97
  text: '**Theorem 3.2.** F is not injective on EBCM states: distinct EBCM states (θ, φ, R, ψ) can have
    the same image (S, I, R), because F forgets φ and all of ψ except its value at θ. Whether distinct
    EBCM *trajectories* can project to identical node-level trajectories is not established here.'
- id: Docs.cf.thm3_3
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 103-109
  text: '**Theorem 3.3 (Information loss characterisation; not proved here).** The fibre F⁻¹(S,I,R) over
    a node-level trajectory is parameterised by the space of PGFs ψ with: 1. ψ(1) = 1 (normalisation)
    2. ψ''(1) = κ (mean degree) 3. S(t) = ψ(θ(t)) for all t (consistency) 4. θ(t) solves the EBCM θ-equation
    for ψ (dynamics)'
- id: Docs.cf.thm3_3-lostInformation
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 111-113
  text: 'The node-level trajectory does not determine ψ, but it retains more than the first moment: for
    instance its early growth rate depends on ψ''''(1)/ψ''(1). So the lost information is not simply the
    degree distribution beyond its mean.'
- id: Docs.cf.liftDef
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 119-124
  text: |-
    Given a node-based SIR model with mass-action rates β and γ (R₀ = β/γ), define G by:
    [...]
    G(S, I, R; β, γ) = EBCM(ψ_Poisson(κ), β̃, γ̃) where β̃ = β/κ, γ̃ = γ − β/κ, for any mean degree κ > R₀
- id: Docs.cf.poissonUniqueSection
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 132-135
  text: This embeds the node-based model into an EBCM with the **Poisson PGF**, whose susceptible curve
    matches the node model's after this reparametrisation; the EBCM infected curve differs. Among PGFs,
    only the Poisson PGF gives mass-action dynamics for S (Theorem 4.3(c)).
- id: Docs.cf.thm4_1
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 139-148
  text: |-
    **Theorem 4.1 (corrected).** F and G are not a Galois connection for the dimension preorder (M₁ ≤ M₂ iff dim M₁ ≤ dim M₂) used in the Lean library: the condition
    [...]
    F(E) ≤ N ⟺ E ≤ G(N)
    [...]
    fails for E = ⟨10, r⟩ and N = ⟨3, r⟩, where F(E) ≤ N holds but E ≤ G(N) does not (`not_galoisConnection_coarseGrain_poissonLift`).
- id: Docs.cf.cor4_2-FG
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 153-153
  text: F ∘ G = id_Node (coarse-graining the Poisson lift recovers the original)
- id: Docs.cf.cor4_2-GF
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 154-154
  text: G ∘ F ≠ id_Edge (projecting then lifting forgets the original PGF)
- id: Docs.cf.cor4_2-GFG
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 155-155
  text: G ∘ F ∘ G = G (the connection is idempotent)
- id: Docs.cf.cor4_2-FGF
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 156-156
  text: F ∘ G ∘ F = F (the connection is idempotent)
- id: Docs.cf.thm4_3
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 163-169
  text: '**Theorem 4.3.** (a) ψ''''(1)/ψ''(1) = ψ''(1) (excess degree equals mean degree) iff the degree
    distribution has variance equal to its mean. (b) A Poisson degree distribution satisfies (a). (c)
    The EBCM has mass-action form for S iff ψ'' = κψ on [0, 1], i.e. iff the degree distribution is Poisson.
    (a) does not imply Poisson: ψ(u) = (1 + u²)/2 satisfies (a) and is not Poisson.'
- id: Docs.cf.thm4_3-massAction
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 173-176
  text: (c) With S = ψ(θ), dS/dt = ψ'(θ)·dθ/dt = −β̃ψ'(θ)φ_I, which equals −(κβ̃)·S·φ_I iff ψ'(θ) = κψ(θ);
    then S(t) solves the mass-action equation with I := φ_I and rates β = κβ̃, γ = β̃ + γ̃ (Rempała 2023).
- id: Docs.cf.pgfClosureTreeLike
  group: Docs
  source:
