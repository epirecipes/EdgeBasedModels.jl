  text: |-
    For a two-degree network with degrees k₁, k₂, degree fractions p₁, p₂, and assortative parameter r ∈ [0,1]: C = [[k₁·(r + (1-r)·q₁), k₁·(1-r)·q₂], [k₂·(1-r)·q₁, k₂·(r + (1-r)·q₂)]] where q_i = k_i·p_i/⟨k⟩ are the excess-degree probabilities.
