  text: In the EBCM, θ(t) is non-increasing (edges can only transmit, not "un-transmit").
- id: Docs.cf.thm8_1
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 363-370
  text: |-
    **Theorem 8.1 (Degree-variance inequality).** Let ψ be any valid PGF with mean degree κ. Then:
    [...]
    ψ''(1)/ψ'(1) = κ + (σ² - κ)/κ = κ + (σ²/κ - 1)
    [...]
    where σ² = Var(degree).
- id: Docs.cf.thm8_1-factor
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 370-371
  text: The ratio of the EBCM excess degree to the mean degree is (ψ''(1)/ψ'(1))/κ = 1 + (σ²/κ - 1)/κ
    = (κ² − κ + σ²)/κ².
