- id: Hierarchy.R26
  group: Hierarchy
  source:
    file: EBCMCategory/Hierarchy.lean
    lines: 76-77
  text: '**Result 26.** Every node model lifts to an edge model via Poisson, preserving R₀.'
- id: Hierarchy.R27
  group: Hierarchy
  source:
    file: EBCMCategory/Hierarchy.lean
    lines: 82-87
  text: '**Result 27.** For a two-moment record with mean κ, excess degree = mean forces variance = mean,
    so the record is the Poisson record `poisson κ` (`PGFData.dispersionIndex_eq_one_iff`). This does
    not make Poisson the unique degree distribution with excess degree = mean: ψ(u) = (1 + u²)/2 has ψ''''(1)/ψ''(1)
    = 1 = ψ''(1) and is not Poisson.'
- id: Hierarchy.R28
  group: Hierarchy
  source:
    file: EBCMCategory/Hierarchy.lean
    lines: 102-105
  text: '**Result 28.** Some PGF record with mean κ (the Poisson record) gives an edge model with R₀ =
    T·ψ''''(1)/ψ''(1). Matching the mean does not preserve R₀: the edge model of a record ψ has the node
    model''s R₀ T·κ iff ψ''''(1)/ψ''(1) = κ (`edge_lift_R0_eq_iff`).'
- id: Hierarchy.edgeLiftR0EqIff
  group: Hierarchy
  source:
    file: EBCMCategory/Hierarchy.lean
    lines: 111-112
  text: The edge model of a record ψ has the R₀ of the node model with mean degree κ iff ψ''(1)/ψ'(1)
    = κ.
- id: Hierarchy.pairLtFull
  group: Hierarchy
  source:
