  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 44-44
  text: '| VM7 | IC bookkeeping: with S(0) = ψ(1) = 1, S(0) + pop_I(0) + pop_R(0) = 1 + sf |'
- id: VolzMeyersEquations.table.VM8
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 45-45
  text: '| VM8 | Mass-action recovery for ψ(x)=x (k=1) in the fast-mixing limit |'
- id: VolzMeyersEquations.thetaNonincreasing
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 109-109
  text: '**VM1.** θ is non-increasing: dθ/dt ≤ 0 whenever β > 0, P₁ ≥ 0, θ ≥ 0.'
- id: VolzMeyersEquations.edgePartition
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 117-117
  text: '**VM2.** Edge partition: P₁ + P_S + P_R = 1 (by definition of P_R).'
- id: VolzMeyersEquations.populationInflux-a
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 122-122
  text: '**VM3.** Population dynamics: d(I + R)/dt = incidence.'
- id: VolzMeyersEquations.populationInflux-b
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 123-125
  text: This is the influx of newly infected from the susceptible pool, with the Lean incidence (which
    drops the factor ψ(θ); see `VMState.incidence`).
- id: VolzMeyersEquations.sNonincreasing-a
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 130-131
  text: '**VM4.** S is non-increasing (for Poisson PGF, S = exp(κ(θ-1))). Since θ is non-increasing (VM1)
    and exp is monotone, S is non-increasing.'
- id: VolzMeyersEquations.sNonincreasing-b
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 132-134
  text: 'Motivated by: dS/dt = κ·S·dθ/dt ≤ 0 when κ > 0. The Lean statement is only κ·dθ/dt ≤ 0 (the factor
    S ≥ 0 is omitted); nothing is proved about S along solutions.'
- id: VolzMeyersEquations.staticThetaEq-a
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 153-154
  text: '**VM5.** In the static limit, the θ equation dθ/dt = −β P₁ θ is independent of ρ'
- id: VolzMeyersEquations.staticThetaEq-b
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 154-154
  text: (the ρ terms only appear in the P₁, P_S equations)
- id: VolzMeyersEquations.staticThetaEq-c
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 42-156
  text: |-
    reduces to static EBCM
    [...]
    The static EBCM's dθ/dt = −β·φ_I corresponds to P₁ playing the role of φ_I/θ.
- id: VolzMeyersEquations.fastMixingP1Equilibrium-a
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 163-163
  text: '**VM6.** In the fast-mixing limit, P₁ → M₁'
- id: VolzMeyersEquations.fastMixingP1Equilibrium-b
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 163-163
  text: and P_S → ψ'(θ)/ψ'(1).
- id: VolzMeyersEquations.fastMixingP1Equilibrium-c
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 164-164
  text: 'For Poisson: ψ''(θ)/ψ''(1) = ψ(θ) = S (since ψ''(θ) = κ·ψ(θ) and ψ''(1) = κ).'
- id: VolzMeyersEquations.fastMixingP1Equilibrium-d
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 166-169
  text: 'Motivated by: the swap terms ρ(M₁ − P₁) and ρ(ψ''(θ)/ψ''(1) − P_S) drive P₁ and P_S to their
    population-level values at rate ρ. The Lean statement is only that the swap term ρ(M₁ − P₁) vanishes
    when P₁ = M₁; no limit ρ → ∞ is formalised.'
