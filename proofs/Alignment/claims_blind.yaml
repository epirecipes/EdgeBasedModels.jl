  text: |-
    Objects are ODE systems on population-level state spaces.
    [...]
    **Morphisms:** ODE-system maps (h: X → X') such that h intertwines the vector fields: Dh ∘ f = f' ∘ h (semi-conjugacy).
    [...]
    This is a category we call **Node**
