  text: '**Conjecture 6.1.** There exists a symmetric monoidal functor ``` F_open: Open(Edge) → Open(Node)
    ``` from the category of open EBCM systems to open node-based systems, such that: 1. F_open on closed
    systems (no boundary) agrees with F from §3 2. F_open preserves composition (is monoidal) 3. The Poisson
    section G lifts to G_open: Open(Node) → Open(Edge) 4. (F_open, G_open) form a monoidal Galois connection'
- id: Docs.cf.thm7_1
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 330-336
  text: '**Theorem 7.1 (withdrawn).** It is not true that every SIR trajectory is reproduced exactly by
    EBCMs with arbitrary PGFs ψ with ψ''(1) = κ: an EBCM with given ψ has only two rates (β̃, γ̃), which
    cannot in general match an arbitrary curve S(t). The earlier proof defined θ(t) = ψ⁻¹(S(t)) but did
    not check that θ(t) solves the EBCM θ-equation. What does hold is the Poisson lift of §4.1: for Poisson
    ψ and κ > R₀ the EBCM reproduces the mass-action S(t) (Rempała 2023).'
- id: Docs.cf.liftNotUnique
  group: Docs
