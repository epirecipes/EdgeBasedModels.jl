    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 110-111
  text: 'A packaged version of the safe regime: normalized nonnegative weights yield both total-mass conservation
    and pointwise nonnegativity of the triple terms.'
- id: PairwiseClosureConditions.convexMixNonneg
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 123-123
  text: A convex mixture of nonnegative weights is nonnegative.
- id: PairwiseClosureConditions.barnardWeightsNormalized.a
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 135-135
  text: A convex mixture of normalized weight families is normalized.
- id: PairwiseClosureConditions.barnardWeightsNormalized.b
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 135-139
  text: 'This is the key algebraic fact behind Barnard''s improved closure: it mixes the unclustered weights
    (probability 1 − φ) with the normalised clustered weights (probability φ), which gives Σ_A [ASI] =
    (n − 1)[SI] (Barnard 2018, PhD thesis, University of Sussex, §4.3.2, "Improved closure").'
- id: PairwiseClosureConditions.barnardWeightsNonneg
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 156-157
  text: Barnard-style mixed weights stay nonnegative when both the unclustered and clustered probability
    models are pointwise nonnegative.
- id: PairwiseClosureConditions.barnardStyleClosureSafe
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 168-169
  text: Barnard-style closures are safe whenever both constituent probability models are normalized and
    nonnegative.
- id: PairwiseClosureConditions.keelingFactorNonneg
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 186-187
  text: If the Keeling correlation correction stays nonnegative, then the Keeling weight factor is nonnegative.
- id: PairwiseClosureConditions.keelingWeightsNonneg
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 198-199
  text: If the baseline weights and the correlation correction are both nonnegative, then the Keeling-reweighted
    weights are nonnegative.
- id: PairwiseClosureConditions.keelingStyleClosureSafe.a
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 211-212
  text: Keeling-style closures are safe only after an *additional normalization theorem* is supplied.
- id: PairwiseClosureConditions.keelingStyleClosureSafe.b
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 212-213
  text: Positivity follows from nonnegative baseline weights and nonnegative correlation corrections,
- id: PairwiseClosureConditions.keelingStyleClosureSafe.c
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 213-214
  text: but conservation must be assumed separately.
- id: SEIREquations.table.SEIR1
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 19-19
  text: '| SEIR1 | I_pop counts only infectious stages (I), not E |'
- id: SEIREquations.table.SEIR2
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 20-20
  text: '| SEIR2 | E does not contribute to the edge hazard |'
- id: SEIREquations.table.SEIR3
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 21-21
  text: '| SEIR3 | S + E + I + R = 1 (conservation, excluding seed) |'
- id: SEIREquations.table.SEIR4
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 22-22
  text: '| SEIR4 | θ only decreases from I-edges (not E-edges) |'
- id: SEIREquations.table.SEIR5
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 23-23
  text: '| SEIR5 | SEIR final size = SIR final size at the same β, γ (the latent period delays the epidemic
    but does not change T = β/(β+γ)) |'
- id: SEIREquations.table.SEIR6
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 24-24
  text: '| SEIR6 | SEIR peak I ≤ SIR peak I (at same R₀): expected from simulations, not proved here |'
- id: SEIREquations.edgeHazard
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 63-64
  text: 'The edge hazard: only I contributes (E has zero transmission rate). **SEIR2**: E does NOT contribute
    to edge hazard.'
- id: SEIREquations.dTheta
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 67-68
  text: 'dθ/dt = −β·φ_I (only infectious edges cause transmission). **SEIR4**: θ does not decrease from
    E-edges.'
- id: SEIREquations.iPop
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 71-72
  text: 'I_pop = pop_I only (NOT pop_E + pop_I). **SEIR1**: This is the key invariant that was violated
    in the bug.'
- id: SEIREquations.seirPopulationConservation
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 91-92
  text: '**SEIR3.** Population conservation: d(E + I + R)/dt = incidence. The total non-susceptible fraction
    grows exactly at the incidence rate.'
- id: SEIREquations.iPopZeroAtSeed-a
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 100-100
  text: '**SEIR1.** I_pop counts only infectious stages.'
- id: SEIREquations.iPopZeroAtSeed-b
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 101-101
  text: 'At t=0 with seed in E: I_pop = 0, not ε.'
- id: SEIREquations.iPopWrongNonzeroAtSeed
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 107-107
  text: The buggy version gives ε at t=0 (wrong).
- id: SEIREquations.iPopLeWrong
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 114-114
  text: '**SEIR1b.** I_pop ≤ I_pop_wrong (correct is always ≤ buggy).'
- id: SEIREquations.edgeHazardIndependentOfE
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 122-122
  text: '**SEIR2.** The edge hazard is independent of φ_E.'
- id: SEIREquations.seirThetaNonincreasing
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 128-128
  text: '**SEIR4.** θ is non-increasing (same proof as SIR).'
- id: SEIREquations.seirIGrowthBounded-a
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 137-140
  text: '**SEIR5 (auxiliary; not a peak bound).** If σ·pop_E ≤ pop_E + pop_I, then dI/dt ≤ pop_E + pop_I
    − γ·pop_I. Since dI/dt = σ·pop_E − γ·pop_I, this only restates the hypothesis; it does not compare
    SEIR with SIR, and σ·pop_E can exceed the SIR incidence.'
- id: SEIREquations.seirIGrowthBounded-b
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 140-140
  text: No bound on the SEIR peak follows.
- id: SurvivalBridge.header.ptCharacterisation
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 11-14
  text: '**Poisson-type characterisation** (Theorem 1): The pairwise closure is exact iff the degree distribution
    is Poisson, Binomial, or Negative Binomial — collectively called "Poisson-type" (PT) distributions.
    These are exactly the distributions whose PGF satisfies ψ''(u) = α·ψ(u)^κ.'
- id: SurvivalBridge.header.threeModelEquivalence
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 16-18
  text: '**Three-model equivalence** (Theorem 2): For PT distributions, the pairwise model, Volz''s EBCM,
    and the DSA model are all equivalent and exact in the N→∞ limit.'
- id: SurvivalBridge.header.survivalEquation
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 20-22
  text: '**Survival equation** (Eq. 33): Under PT assumptions, the epidemic dynamics collapse to a SINGLE
    autonomous ODE for the survival probability S_t, enabling statistical inference from incidence data.'
- id: SurvivalBridge.header.kappaInvariant-a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 24-25
  text: 'The key invariant is κ = ψ''''(θ)ψ(θ)/ψ''(θ)², which is constant in θ iff the degree distribution
    is PT:'
- id: SurvivalBridge.header.kappaInvariant-b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 26-28
  text: '* κ = (n-1)/n for Binomial(n,p) * κ = 1 for Poisson(λ) * κ = (r+1)/r for NegBin(r,p)'
- id: SurvivalBridge.header.categorical.naturalIso
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 32-37
  text: 'No category or functor is formalised here. Informally, Volz''s model and the DSA model are two
    ODE systems for the same configuration-model epidemic: Volz : edge-probability variables θ, p_I, p_S
    DSA : survival variables x_θ, x_{SI}, x_{SS}'
- id: SurvivalBridge.header.categorical.eta
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 38-40
  text: They are related by the change of variables x_θ = θ, x_{SI} = p_I · θ · ψ'(θ), x_{SS} = p_S ·
    θ · ψ'(θ) (Kiss, Kenah & Rempała 2023, App. B), which is invertible when θ·ψ'(θ) > 0.
- id: SurvivalBridge.header.categorical.pairwiseIso
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 42-45
  text: 'For PT distributions the pairwise model with closure constant κ is a third equivalent description:
    Pairwise ≅ DSA ≅ Volz (iff PT degree distribution)'
- id: SurvivalBridge.header.categorical.colimit
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 47-48
  text: The survival equation (33) is a reduction of these systems to a single scalar ODE for S_t; it
    is not a colimit in any formalised sense.
- id: SurvivalBridge.table.R41
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 54-54
  text: '| 41 | The PT ODE ψ'' = α·ψ^κ characterises Poisson-type dists|'
- id: SurvivalBridge.table.R42
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 55-55
  text: '| 42 | Poisson ⇒ κ(1) = 1 (κ ≡ 1 on an interval iff Poisson) |'
- id: SurvivalBridge.table.R43
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 56-56
  text: '| 43 | Some record has κ(1) < 1 (Binomial: κ ≡ (n-1)/n) |'
- id: SurvivalBridge.table.R44
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 57-57
  text: '| 44 | Some record has κ(1) > 1 (NegBin: κ ≡ (r+1)/r) |'
- id: SurvivalBridge.table.R45
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 58-58
  text: '| 45 | The Volz ↔ DSA variable change is invertible |'
- id: SurvivalBridge.table.R46
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 59-59
  text: '| 46 | S = ψ(θ) gives dS/dt = −β x_SI (chain rule; informal) |'
- id: SurvivalBridge.table.R47
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 60-60
  text: '| 47 | Poisson ⇒ κ(1) = 1 (DSA has mass-action form, rescaled) |'
- id: SurvivalBridge.table.R48
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 61-61
  text: '| 48 | PT closure constant κ = excess/degree ratio |'
- id: SurvivalBridge.table.R49
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 62-62
  text: '| 49 | Non-PT distributions: κ(t) varies, closure is approximate|'
- id: SurvivalBridge.table.R50
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 63-63
  text: '| 50 | Volz-DSA equivalence holds for ANY degree distribution |'
- id: SurvivalBridge.closureKappa-b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 79-79
  text: This is the ratio of mean excess degree to mean degree.
- id: SurvivalBridge.closureKappa-c
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 80-83
  text: 'The function κ(θ) = ψ''''(θ)ψ(θ)/ψ''(θ)² is constant in θ iff the degree distribution is Poisson-type;
    `closureKappa` records only its value κ(1), which does not determine the family: ψ(u) = (1 + u²)/2
    has κ(1) = 1 but is not Poisson.'
- id: SurvivalBridge.volzState-a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 126-131
  text: 'They are related by (Kiss, Kenah & Rempała 2023, App. B): x_{SI} = p_I · θ · ψ''(θ) x_{SS} =
    p_S · θ · ψ''(θ) The maps `volzToDSA`/`dsaToVolz` below multiply and divide by an arbitrary scalar
    factor `psi_prime`; this change of variables is the instance `psi_prime := θ·ψ''(θ)`.'
- id: SurvivalBridge.volzState-b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 132-132
  text: This is invertible whenever θ·ψ'(θ) > 0.
- id: SurvivalBridge.R42
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 94-95
  text: '**Result 42.** For Poisson, κ = 1. This is because ψ''''(1) = κ² and ψ''(1) = κ, so κ = κ²/κ²
    = 1.'
- id: SurvivalBridge.R43a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 102-102
  text: '**Result 43.** For Binomial(n, p), κ = (n-1)/n < 1.'
- id: SurvivalBridge.R43b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 103-103
  text: We construct a Binomial(3, p) example where ψ'(1) = 3p, ψ''(1) = 6p².
- id: SurvivalBridge.R44a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 112-112
  text: '**Result 44.** For NegBin(r, p), κ = (r+1)/r > 1.'
- id: SurvivalBridge.R44b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 113-113
  text: We construct a NegBin(2, 1/2) example where mean = 2, ψ''(1) = 6.
- id: SurvivalBridge.R45a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 158-158
  text: '**Result 45.** The round-trip Volz → DSA → Volz is the identity.'
- id: SurvivalBridge.R45b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 159-160
  text: Together with `dsa_volz_roundtrip`, the variable change is a bijection of state spaces for every
    nonzero scalar factor.
- id: SurvivalBridge.R46a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 177-178
  text: '**Result 46.** The survival map S_t = ψ(θ(t)) relates the EBCM to node-level survival analysis
    (informal; no category is defined).'
- id: SurvivalBridge.R46b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 180-185
  text: 'For any PGF, if we define S = ψ(θ) and differentiate, with x_{SI} = p_I · θ · ψ''(θ) as in Kiss,
    Kenah & Rempała (2023, App. B): dS/dt = ψ''(θ) · dθ/dt = ψ''(θ) · (-β·p_I·θ) = -β · x_{SI} So the
    DSA equation ẋ_S = -β·x_{SI} is the chain rule applied to S = ψ(θ). This chain-rule computation is
    not formalised here.'
- id: SurvivalBridge.R46c
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 187-190
  text: Here we prove the algebraic identity that, for Poisson degrees, the EBCM R₀ T·ψ''(1)/ψ'(1) equals
    T·μ, where μ = mean degree (the `nodeModel` value). The DSA model is equivalent to Volz's for every
    degree law, so its R₀ is also T·ψ''(1)/ψ'(1).
- id: SurvivalBridge.R47a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 198-207
  text: '**Result 47.** For Poisson networks (κ=1), the DSA survival equation has the form of the classical
    mass-action SIR survival equation, with rescaled rates. From Eq (33) of the paper, with κ=1: -dS/dt
    = β̃(S - S²) + γ̃·S·log(S) + ρ̃·S This has the form of the mass-action SIR survival equation of KhudaBukhsh
    et al. (2020), with β̃ = μβ, γ̃ = β + γ and ρ̃ = βμρ. The Lean theorem proves only that the Poisson
    record has closureKappa = 1.'
- id: SurvivalBridge.R47b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 207-209
  text: The proof is that the Poisson PGF ψ(u) = e^{λ(u-1)} satisfies ψ''·ψ/(ψ')² = 1 identically, which
    eliminates all network-structure terms.
- id: SurvivalBridge.R48a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 216-217
  text: '**Result 48.** The closure parameter κ equals the dispersion-scaled ratio: κ = secondFactorial
    / mean².'
- id: SurvivalBridge.R48b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 219-220
  text: For the pairwise closure to be exact, κ must be constant as θ varies. This happens iff ψ'(u) =
    α·ψ(u)^κ, which characterises PT distributions.
- id: SurvivalBridge.R48c
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 222-226
  text: 'For a PT law (κ(θ) constant), the value of κ determines the family: * κ < 1: Binomial(n, p) with
    n = 1/(1-κ); this needs 1/(1-κ) ∈ ℕ, so κ ∈ [0, 1) is realised only for κ = (n-1)/n * κ = 1: Poisson(λ)
    * κ > 1: NegBin(r, p) with r = 1/(κ-1)'
- id: SurvivalBridge.R49a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 231-235
  text: '**Result 49.** Some degree record has closure constant κ(1) ≠ 1 and dispersion index ≠ 1. A two-moment
    record cannot show that a law is non-PT. For a non-PT law such as ψ(u) = (1 + u²)/2, κ(θ) = (1 + θ²)/(2θ²)
    varies with θ, making the pairwise closure approximate rather than exact.'
- id: SurvivalBridge.R49b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 237-240
  text: 'Witness: the record mean 10, ψ''''(1) = 200 (κ(1) = 2, dispersion 11). It is the record of the
    geometric law (NegBin with r = 1), which is PT; the bimodal law with 80% degree 4 and 20% degree 34
    has mean 10 but ψ''''(1) = 234.'
- id: SurvivalBridge.R50a
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 251-252
  text: '**Result 50.** The Volz ↔ DSA equivalence holds for ANY degree distribution with finite variance
    — not just PT distributions.'
- id: SurvivalBridge.R50b
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 254-255
  text: The variable change x_{SI} = p_I · θ · ψ'(θ) is well-defined and invertible whenever θ·ψ'(θ) >
    0,
- id: SurvivalBridge.R50c
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 255-256
  text: which holds for all θ ∈ (0,1] when the degree distribution has positive mean.
- id: SurvivalBridge.R50d
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 258-261
  text: 'The difference is: * For PT distributions: Pairwise ≅ DSA ≅ Volz (all three equivalent) * For
    non-PT distributions: DSA ≅ Volz (still equivalent), but Pairwise is only approximate'
- id: SurvivalBridge.R50e
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 263-266
  text: This is formalised here only as the round trip of Result 45 with the scalar factor ψ'(1) = mean
    degree, so it needs only ψ'(1) ≠ 0 and no condition on κ. It is a statement about one linear rescaling,
    not about the ODE systems.
- id: SurvivalBridge.dsaVolzRoundtrip
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 167-167
  text: The round-trip DSA → Volz → DSA is the identity.
- id: VolzMeyersEquations.header.equationLevel
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 7-13
  text: 'This file states scalar identities motivated by the **Volz–Meyers (2007) neighbour-exchange (NE)
    model**: sign conditions and conservation identities for pointwise right-hand-side expressions, and
    initial-condition bookkeeping. No full ODE system is formalised: only the θ, pop_I and pop_R right-hand
    sides are defined, as scalar expressions of a state record; the P_S, P₁ and M₁ equations are not,
    and nothing is proved about solutions.'
- id: VolzMeyersEquations.header.table4System
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 21-32
  text: |-
    Variables: θ, P₁, P_S, M₁ (4 ODEs + 2 population-level: pop_I, pop_R)
    [...]
    Susceptible fraction: S = ψ(θ)
- id: VolzMeyersEquations.header.popIEquation
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 29-92
  text: |-
    | pop_I | = β P₁ θ ψ'(θ) − γ pop_I |
    [...]
    The Lean incidence β·P₁·θ·κ. The Volz–Meyers incidence is β·P₁·θ·ψ'(θ); for Poisson, ψ'(θ) = κ·ψ(θ), so it is β·P₁·θ·κ·ψ(θ). This definition drops the factor ψ(θ) and agrees with the model only while ψ(θ) = 1, i.e. at θ = 1.
- id: VolzMeyersEquations.table.VM1
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 38-38
  text: '| VM1 | θ is non-increasing (dθ/dt ≤ 0) |'
- id: VolzMeyersEquations.table.VM2
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 39-39
  text: '| VM2 | Edge partition: P₁ + P_S + P_R = 1 (where P_R = 1-P₁-P_S) |'
- id: VolzMeyersEquations.table.VM3
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 40-40
  text: '| VM3 | Population conservation: d(pop_I + pop_R)/dt = incidence |'
- id: VolzMeyersEquations.table.VM4
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 41-41
  text: '| VM4 | S is non-increasing (follows from VM1 and PGF monotonicity) |'
- id: VolzMeyersEquations.table.VM5
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 42-42
  text: '| VM5 | Static limit (ρ=0): θ̇ = −β P₁ θ reduces to static EBCM |'
- id: VolzMeyersEquations.table.VM6
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 43-43
  text: '| VM6 | Swap term ρ(M₁ − P₁) vanishes at P₁ = M₁ (fast-mixing motivation) |'
