- id: InvariantRegion.header.model
  group: InvariantRegion
  source:
    file: EBCMCategory/InvariantRegion.lean
    lines: 20-37
  text: 'The expanded single-type SIR EBCM (Volz 2008, Miller 2011) has ODE variables θ, φ_I, φ_R, R with
    the vector field: dθ/dt = −β φ_I dφ_I/dt = β φ_I ψ″(θ) / ψ′(1) − (β + γ) φ_I dφ_R/dt = γ φ_I dR/dt
    = γ (1 − ψ(θ) − R) (The φ_I equation follows from φ_I = θ − φ_S − φ_R with φ_S = ψ′(θ)/ψ′(1); it is
    the form the Julia builders integrate. Several statements below were written for the incorrect form
    (β φ_I / θ)(ψ′(θ) / ψ′(1)) − (β + γ) φ_I; the corresponding statements for the correct form are `phi_I_dot_correct_*`.)
    Derived observables (algebraic, not ODE variables): S = ψ(θ) I = 1 − S − R ← by definition; so S +
    I + R = 1 identically φ_S = ψ′(θ)/ψ′(1)'
- id: InvariantRegion.header.faceConditions
  group: InvariantRegion
  source:
    file: EBCMCategory/InvariantRegion.lean
    lines: 46-48
  text: '**Sign/monotone conditions**: at each face of the region the component of the vector field normal
    to the face is ≥ 0 (it vanishes or points inward), given the constraints φ_I ≤ θ and S + R ≤ 1, which
    `EBCMRegion` omits.'
- id: InvariantRegion.header.nagumoConditional
  group: InvariantRegion
  source:
    file: EBCMCategory/InvariantRegion.lean
    lines: 49-57
  text: |-
    These are the hypotheses of Nagumo's theorem (not in Mathlib); this file does not invoke it.
    [...]
    No invariance theorem is stated here, conditionally or otherwise: the results are pointwise sign conditions on the right-hand side, and nothing is proved about solutions.
