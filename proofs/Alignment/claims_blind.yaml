- id: PairwiseClosureConditions.header.safeRegime
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 9-21
  text: 'If a closed triple is written in the form `[ASI]_A = B * p_A` where `B = (n - 1)[SI]` is a nonnegative
    base term and the weights `p_A` satisfy * `∑_A p_A = 1`, * `p_A ≥ 0` for every state `A`, then two
    things follow: 1. the total triple mass is conserved: `∑_A [ASI]_A = B`, 2. each triple count is nonnegative.'
