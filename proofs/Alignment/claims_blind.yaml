    [...]
    We use a **concrete ℚ-valued surrogate** with mnemonic labels: two order-4 entries (`a = C_4 SISI`, `b = C_4 SSSS` placeholder) and one order-3 entry (`c = P_3 SIS`); `M_Q(a,b) = a + b`; `F4_Kirkwood (a,b) = (a*b, b)`; `F3_Kirkwood c = c^2 / 4`. In Lean the index types are `Idx4 = {a, b}` and `Idx3 = {c}`, not `Order4Var`/`Order3Var`.
