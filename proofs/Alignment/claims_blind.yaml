    lines: 196-196
  text: S(t) = ψ(θ(t)) (exact on configuration-model networks as N → ∞, which are locally tree-like)
- id: Docs.cf.edgeTreeFunctor
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 211-214
  text: '**Informal statement** (no category is defined): on configuration-model networks the map F yields
    a closed node-level ODE (Proposition 3.1). On clustered networks it does not without additional structure
    (triangle-closing terms, Volz''s clustering corrections).'
- id: Docs.cf.nonMarkovObstruction
  group: Docs
