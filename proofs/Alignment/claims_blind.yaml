    In the edge-swapping EBCM, R₀ depends on the rewiring rate η (Miller, Slim & Volz 2012, §3.2.1; see `R0_edgeSwap`).
- id: DynamicLimits.fastRewiringR0MeanDegree
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 98-100
  text: Its R₀ is (β/γ)⟨K²⟩/⟨K⟩ = (β/γ)(ψ''(1)/ψ'(1) + 1) (`R0_mfsh`), which keeps degree heterogeneity.
    The R₀ stored here, T·ψ'(1) = βκ/(β+γ), is not that limit; it is kept for compatibility (Results 36,
    37).
- id: DynamicLimits.R34
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 164-166
  text: '**Result 34.** Coarse-graining commutes with the static limit. F(dynamic) = F(staticLimit(dynamic)),
    because both give dim 3 with the same R₀.'
- id: DynamicLimits.R35a
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 172-173
  text: '**Result 35.** The fast-rewiring limit has the same dimension as coarse-graining (both give dim
    = 3).'
- id: DynamicLimits.R35b
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 174-175
  text: 'It is not a coarse-graining of the same model: the MFSH R₀ differs from the static R₀ (`R0_static_lt_mfsh`).'
- id: DynamicLimits.R36a
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 182-183
  text: '**Result 36.** For Poisson networks, the value T·κ stored by `fastRewiringLimit` equals the static
    EBCM R₀.'
- id: DynamicLimits.R36b
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 183-184
  text: 'This is because the Poisson excess degree equals the mean degree: ψ''''(1)/ψ''(1) = κ.'
- id: DynamicLimits.R37a
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 197-199
  text: '**Result 37.** Some degree record has a stored fast-rewiring value T·κ different from the static
    EBCM R₀. The genuine fast-rewiring (MFSH) R₀ exceeds the static R₀ for every degree law (`R0_static_lt_mfsh`).'
- id: DynamicLimits.R37b
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 201-203
  text: 'Witness: a network with mean κ=3, second factorial=15 (excess=5). T=1/2, so EBCM R₀ = 5/2 and
    T·κ = 3/2; with β = γ = 1 the MFSH R₀ is 5 + 1 = 6.'
- id: DynamicLimits.R38
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 214-215
  text: '**Result 38.** The dynamic model refines the static model (it has strictly more state variables:
    5 > 4).'
- id: DynamicLimits.R39
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 221-222
  text: '**Result 39.** The fast-rewiring limit is coarser than the static limit. Mean-field (dim 3) ≤
    Static EBCM (dim 4).'
- id: DynamicLimits.R40a
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 228-228
  text: '**Result 40.** The full tower: mean-field < static EBCM < dynamic EBCM.'
- id: DynamicLimits.R40b
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 229-231
  text: 'Combined with Hierarchy.lean, this gives, for N ≥ 4: Mean-field (3) < Static EBCM (4) < Dynamic
    EBCM (5) < Pair (12N) < Full (3^N); the last inequality fails for N ≤ 3.'
- id: DynamicLimits.r0EdgeSwapZero
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 242-243
  text: At rewiring rate η = 0 the edge-swapping R₀ is the static-limit R₀ T·ψ''(1)/ψ'(1).
- id: DynamicLimits.r0EdgeSwapTendstoMfsh
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 249-250
  text: As the rewiring rate η → ∞, the edge-swapping R₀ tends to the MFSH R₀ (β/γ)(ψ''(1)/ψ'(1) + 1).
- id: DynamicLimits.r0StaticLtMfsh
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 277-278
  text: 'The MFSH (fast-rewiring) R₀ exceeds the static-limit R₀ for every degree record: (β/γ)(ψ''''(1)/ψ''(1)
    + 1) > β/(β+γ) · ψ''''(1)/ψ''(1).'
- id: DynamicLimits.r0MfshPoisson
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 288-288
  text: For Poisson degrees the MFSH (fast-rewiring) R₀ is (β/γ)(κ + 1).
- id: EpiCategory.header.twoCategories
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 6-11
  text: 'This file defines scalar records motivated by two informal classes of epidemic models; no categorical
    structure is formalised: * **Node** models: ODE systems on population-level state spaces (S, I, R)
    * **Edge** models: ODE systems on edge-probability state spaces (θ, φ, R), parameterised by a probability
    generating function (PGF)'
- id: EpiCategory.header.refinementPreorder
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 15-17
  text: The only order is the preorder `M₁ ≤ M₂ iff M₁.dim ≤ M₂.dim`; "refinement" below means "has at
    least as many state variables" and nothing more.
- id: EpiCategory.dispersionIndexOneIffPoisson
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 66-69
  text: 'Index of dispersion: σ²/κ. Poisson ⇒ dispersion index 1 (`poisson_dispersion_eq_one`). The converse
    is false for degree distributions: the law with P(0) = P(2) = 1/2, ψ(u) = (1 + u²)/2, has mean 1 and
    variance 1 but is not Poisson.'
- id: EpiCategory.R1
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 54-54
  text: '**Result 1.** For Poisson, the excess degree equals the mean degree.'
- id: EpiCategory.R2
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 60-60
  text: '**Result 2.** For Poisson, the variance equals the mean (equidispersion).'
- id: EpiCategory.transmissibilityPos
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 100-100
  text: Transmissibility is positive.
- id: EpiCategory.transmissibilityLtOne
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 106-106
  text: Transmissibility is less than 1.
- id: EpiCategory.R3
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 139-139
  text: '**Result 3.** The edge model always refines the node model.'
- id: EpiCategory.R4
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 145-145
  text: '**Result 4.** For Poisson networks, both models compute the same R₀.'
- id: EpiCategory.dispersionIndexEqOneIff
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 72-73
  text: A `PGFData` record has dispersion index 1 iff it is the Poisson record of its own mean, i.e. iff
    ψ''(1) = ψ'(1)².
