  text: |-
    The ODE system must be replaced by integro-differential equations or delay-differential equations.
    [...]
    These dynamics are outside the ODE-based **Edge** models, but they are not an obstruction to edge-based modelling: the non-Markovian EBCM is exact for general independent transmission and recovery processes (Sherborne, Miller, Blyuss & Kiss 2018).
- id: Docs.cf.localisedObstruction
