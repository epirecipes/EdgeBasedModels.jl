  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 189-189
  text: '**VM7.** IC consistency: the edge partition holds at t=0.'
- id: VolzMeyersEquations.icPopulation
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 194-194
  text: '**VM7b.** IC consistency: I(0) + R(0) = sf.'
- id: VolzMeyersEquations.icTheta
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 199-199
  text: '**VM7c.** IC consistency: θ(0) = 1 (no transmission at t=0).'
- id: VolzMeyersEquations.massActionIncidence-a
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 206-212
  text: '**VM8.** For a homogeneous network with ψ(x) = x (every node has degree 1, κ=1), the VM model
    reduces to the standard SIR in the fast-mixing limit ρ → ∞. At ρ = 0 it describes isolated pairs,
    not mass action. In the fast-mixing limit: S = θ, P₁ = I, and the equations become dS/dt = −β·I·S,
    dI/dt = β·I·S − γ·I, dR/dt = γ·I.'
- id: VolzMeyersEquations.massActionIncidence-b
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 214-214
  text: We verify that the incidence = β·P₁·θ·κ = β·I·S when κ=1 and P₁=I, θ=S.
