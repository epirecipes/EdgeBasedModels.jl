  text: 'Result 70: Zero clustering recovers standard EBCM'
- id: ClusteringExtension.R70
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 58-58
  text: '**Result 70.** Clustering is zero iff there are no triangle edges.'
- id: ClusteringExtension.R71-sec-a
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 75-77
  text: Within a triangle, a susceptible node can be infected directly (prob T) or indirectly via the
    third node. The total probability of infection through a triangle pair is 1 - (1-T)(1-T²) = T + T²
    - T³ (independent edges).
- id: ClusteringExtension.R71-sec-b
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 78-79
  text: This is not T(2-T) = 1 - (1-T)², the probability that at least one of two independent edges transmits.
- id: ClusteringExtension.R71a
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 81-81
  text: '**Result 71a.** Pair transmission through a triangle.'
- id: ClusteringExtension.R71b
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 85-87
  text: '**Result 71b.** The ring identity T(2 − T) = 2T − T². It is not the per-partner transmissibility
    in a triangle, which is T + T² − T³ (Result 71a); at T = 1/2 the two are 3/4 and 5/8.'
- id: ClusteringExtension.R72
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 99-105
  text: '**Result 72.** The scalar `clustered_R0` = T·(⟨s(s-1)⟩/⟨s+2t⟩) + T·(2⟨t⟩/⟨s+2t⟩)·(1+T), kept
    for compatibility. It is not the R₀ of a clustered network: its triangle term does not scale with
    the excess triangle degree. For triangle-clustered configuration models, R₀ is the spectral radius
    of the next-generation matrix over single-edge and triangle-edge infection types (Miller 2009); it
    is not formalised here.'
- id: ClusteringExtension.R73-sec-a
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 112-116
  text: Converting a triangle (⟨t⟩→⟨t⟩-1) to two single edges (⟨s⟩→⟨s⟩+2) preserves mean degree ⟨k⟩ =
    ⟨s⟩+2⟨t⟩. In the scalar formula `clustered_R0`, a triangle's two stubs contribute T·(1+T) in total,
    i.e. T(1+T)/2 per stub, which is at most the contribution T of a single-edge stub. This is a statement
    about that formula, not a derivation of R₀ for clustered networks.
- id: ClusteringExtension.R73-sec-b
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 118-120
  text: 'The key inequality: for 0 < T ≤ 1, T(1+T)/2 ≤ T, since T(1+T)/2 ≤ T ↔ (1+T)/2 ≤ 1 ↔ T ≤ 1. The
    per-stub value T(1+T)/2 comes from `clustered_R0` and is not sourced.'
- id: ClusteringExtension.R73
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 122-122
  text: '**Result 73.** Triangle edges contribute less per edge than single edges to R₀.'
- id: ClusteringExtension.R74
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 132-132
  text: '**Result 74.** Mean total degree ⟨k⟩ = ⟨s⟩ + 2⟨t⟩.'
