  text: |-
    **Caveat:** Even the Poisson lift is not unique: any mean degree κ > R₀ works, with β̃ = β/κ and γ̃ = γ − β/κ.
    [...]
    The Poisson lift is singled out by giving mass-action dynamics for S, not by any minimality property.
