  text: '**Flow:** `IsFlow F φ` ↔ `(∀ v, φ v 0 = v) ∧ ∀ v t, HasDerivAt (φ v) (F (φ v t)) t`. Existence
    and uniqueness are *hypotheses* on the systems, not derived. `IsFlow` asks for solutions on all of
    `ℝ`, so a field whose solutions blow up in finite time has no flow: `F3Kℝ` (`c ↦ c²/4`) has none (`no_flow_F3Kℝ`).'
