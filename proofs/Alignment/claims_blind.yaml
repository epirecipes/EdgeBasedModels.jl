- id: ConvergenceTheorems.header.scope
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 7-13
  text: States scalar identities motivated by convergence results connecting the edge-based compartmental
    model (EBCM) to classical mass-action SIR, the exactness of pair approximations on trees, the final-size
    fixed-point equation and CLT scaling, together with PGF moment identities, R₀ amplification by degree
    heterogeneity and the epidemic threshold. No convergence result, limit theorem or ODE solution is
    formalised; the tree-exactness and CLT results are cited prose (Results 106 and 111).
- id: ConvergenceTheorems.R105
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 44-48
  text: 'For a Poisson(κ) degree distribution with per-edge transmission rate β̃ and recovery γ̃, the
    susceptible curve S(t) of the EBCM coincides with that of classical SIR with effective rates: β =
    κ β̃ and γ = γ̃ + β̃; the infected curves differ (Rempała 2023).'
- id: ConvergenceTheorems.R105.keyIdentity
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 50-54
  text: 'Key algebraic identity: the Poisson EBCM ODE θ̇ = -β̃ θ + β̃ exp(κ(θ-1)) + γ̃(1-θ) reduces to
    dS/dt = -β S I when S = exp(κ(θ-1)) and I := φ_I (the probability that a partner is infectious and
    has not yet transmitted), not the network prevalence.'
- id: ConvergenceTheorems.R105a
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 58-58
  text: '**Result 105a.** Effective mass-action transmission rate: β = κ β̃.'
- id: ConvergenceTheorems.R105b
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 62-62
  text: '**Result 105b.** Effective mass-action recovery rate: γ = γ̃ + β̃.'
- id: ConvergenceTheorems.effectiveBetaPos
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 66-66
  text: Effective β is positive.
- id: ConvergenceTheorems.effectiveGammaPos
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 71-71
  text: Effective γ is positive.
- id: ConvergenceTheorems.R105c.1
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 76-77
  text: '**Result 105c.** Transmissibility consistency: with β = κβ̃ and γ = γ̃ + β̃, the mass-action
    R₀ is β/γ = κβ̃/(β̃ + γ̃).'
- id: ConvergenceTheorems.R105c.2
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 78-79
  text: With the edge-based transmissibility T_edge = β̃/(β̃ + γ̃), the mass-action R₀ is exactly T_edge
    · κ, the Poisson EBCM R₀ (`R0_massAction_eq_edge`).
- id: ConvergenceTheorems.R105c.3
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 80-80
  text: 'There is no large-κ approximation: the two R₀ agree for every κ.'
- id: ConvergenceTheorems.R105c.4
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 82-82
  text: 'Here we verify the simpler identity: κ · β̃/(β̃ + γ̃) = κβ̃/(β̃ + γ̃).'
- id: ConvergenceTheorems.R105d.1
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 89-90
  text: '**Result 105d.** The Poisson PGF identity: for ψ(x) = exp(κ(x-1)), ψ''(x) = κ·exp(κ(x-1)), so
    ψ''(1) = κ and ψ''''(1) = κ².'
- id: ConvergenceTheorems.R105d.2
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 91-91
  text: Thus the excess degree ratio ψ''(1)/ψ'(1) = κ²/κ = κ.
- id: ConvergenceTheorems.R105e.1
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 97-98
  text: '**Result 105e.** S-substitution identity: if S = exp(κ(θ-1)) and θ̇ = f(θ), then dS/dt = κ·S·θ̇.
    This is the chain rule d/dt[exp(κ(θ-1))] = κ·exp(κ(θ-1))·θ̇.'
- id: ConvergenceTheorems.R105e.2
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 99-100
  text: 'The Lean statement `kappa * S = kappa * S` is tautological: it holds by reflexivity. The chain
    rule itself is `S_theta_chain_rule`.'
- id: ConvergenceTheorems.R106.header
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 125-131
  text: 'On tree networks (no cycles), the pair approximation is exact. Precisely (Sharkey, Kiss, Wilkinson
    and Simon 2015, Theorem 1.1): for Markovian SIR dynamics on a network whose underlying graph is a
    tree, started from a pure state (or from uncorrelated initial node states), the individual-level closure
    (A_i S_j B_k)·(S_j) = (A_i S_j)·(S_j B_k) holds exactly for every triple in the pair equations, so
    the closed pair-based system reproduces the exact node and pair probabilities.'
- id: ConvergenceTheorems.R106
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 133-135
  text: '**Result 106** (not formalised; cited). This library models no contact network, pair probabilities
    or ODE solutions, so the result has no Lean counterpart.'
- id: ConvergenceTheorems.R107a
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 170-170
  text: '**Result 107a.** ψ''''(1)/ψ''(1) = (⟨k²⟩ - ⟨k⟩)/⟨k⟩.'
- id: ConvergenceTheorems.R107b
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 176-176
  text: '**Result 107b.** (⟨k²⟩ - ⟨k⟩)/⟨k⟩ = ⟨k⟩ + Var(k)/⟨k⟩ - 1.'
- id: ConvergenceTheorems.R107c
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 187-187
  text: '**Result 107c.** The two forms are equal: (⟨k²⟩-⟨k⟩)/⟨k⟩ = ⟨k⟩+Var/⟨k⟩-1.'
- id: ConvergenceTheorems.R108a
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 205-205
  text: '**Result 108a.** R₀ = T · (⟨k⟩ + Var(k)/⟨k⟩ - 1).'
- id: ConvergenceTheorems.R108b
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 211-212
  text: '**Result 108b.** Heterogeneity amplifies R₀: for any degree distribution with mean ⟨k⟩ and Var
    ≥ 0, R₀ ≥ T·(⟨k⟩ - 1) = R₀(homogeneous).'
- id: ConvergenceTheorems.R108c
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 226-226
  text: '**Result 108c.** Equality iff Var(k) = 0 (regular network).'
- id: ConvergenceTheorems.R109a
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 258-258
  text: '**Result 109a.** Poisson excess degree equals the mean κ.'
- id: ConvergenceTheorems.R109b
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 266-266
  text: '**Result 109b.** R₀ = T·κ for Poisson networks.'
- id: ConvergenceTheorems.R110.header
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 274-276
  text: 'The final size of an epidemic on a configuration-model network is determined by the fixed point
    θ∞ of: θ∞ = 1 - T + T · ψ''(θ∞)/ψ''(1).'
- id: ConvergenceTheorems.R110.stability
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 278-280
  text: For strictly convex f (some degree ≥ 3 has positive probability) it is the only fixed point in
    [0, 1] iff R₀ ≤ 1, where R₀ = f'(1) (not formalised here).
- id: ConvergenceTheorems.R110a
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 291-291
  text: '**Result 110a.** θ = 1 is always a fixed point: f(1) = 1 when g(1) = 1.'
- id: ConvergenceTheorems.R110b.1
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 297-298
  text: '**Result 110b.** The derivative f''(θ) = T · g''(θ). At θ = 1: f''(1) = T · g''(1) = T · ψ''''(1)/ψ''(1)
    = R₀.'
- id: ConvergenceTheorems.R110b.2
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 299-301
  text: Linear stability of θ = 1 needs |f'(1)| < 1, i.e. R₀ < 1; at R₀ = 1 the linearisation is inconclusive,
    and θ = 1 is still attracting from below when f is strictly convex.
- id: ConvergenceTheorems.R110b.3
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 303-304
  text: '**Tautological Lean statement:** `T * excessDeg = T * excessDeg`; the derivative is computed
    in `finalSizeMap_hasDerivAt`.'
- id: ConvergenceTheorems.R110c.1
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 308-308
  text: '**Result 110c.** When R₀ ≤ 1, the disease-free equilibrium θ = 1 is stable:'
- id: ConvergenceTheorems.R110c.2
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 309-309
  text: '|f''(1)| ≤ 1 iff T · excessDeg ≤ 1 (since both T and excessDeg are nonneg).'
- id: ConvergenceTheorems.R110d
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 333-333
  text: '**Result 110d.** When T = 0 (no transmission), the fixed point is trivially θ = 1.'
- id: ConvergenceTheorems.R111a
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 341-349
  text: 'For SIR epidemics on configuration-model random graphs with bounded degrees and an arbitrary
    infectious-period distribution, the final size Z_n satisfies √n(Z_n/n − ρ) ⇒ N(0, σ²) with an explicit
    σ² (so Z_n/n → ρ in probability) in any of three regimes (Ball 2021): the initially infected fraction
    converges to a limit ε ∈ (0, 1) (Theorem 2.1); R₀ > 1, the number of initial infectives is fixed,
    and the statement is conditional on a major outbreak, of size at least log n (Theorem 2.2); or R₀
    > 1 and the number of initial infectives tends to infinity while their fraction tends to zero, without
    conditioning (Theorem 2.3).'
