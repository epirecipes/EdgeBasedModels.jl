- id: ClosureTheorem.header.closureExact
  group: ClosureTheorem
  source:
    file: EBCMCategory/ClosureTheorem.lean
    lines: 18-21
  text: 'The pairwise model approximates triples in terms of pairs: [ASI] = kappa * [AS][SI] / [S] where
    kappa = psi''''(theta) psi(theta) / psi''(theta)^2. This closure is exact (N -> infinity) iff kappa
    is constant for all theta.'
- id: ClosureTheorem.header.verificationStrategy
  group: ClosureTheorem
  source:
    file: EBCMCategory/ClosureTheorem.lean
    lines: 25-30
  text: 'We check the sufficiency identities for PT families: for each PT family, the values psi(theta),
    psi''(theta), psi''''(theta) of its PGF, written as monomials in free scalars, satisfy psi'''' psi
    = kappa (psi'')^2 as ring identities. The necessity direction of KKR Theorem 1 (only PT laws have
    constant kappa) is not formalised; we only exhibit one non-PT law, psi = 1/2 + theta^2/2, whose ratio
    kappa(theta) takes two different values.'
