- id: Docs.cf.thm4_3
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 163-169
  text: '**Theorem 4.3.** (a) ψ''''(1)/ψ''(1) = ψ''(1) (excess degree equals mean degree) iff the degree distribution has variance equal to its mean. (b) A Poisson degree distribution satisfies (a). (c) The EBCM has mass-action form for S iff ψ'' = κψ on [0, 1], i.e. iff the degree distribution is Poisson. (a) does not imply Poisson: ψ(u) = (1 + u²)/2 satisfies (a) and is not Poisson.'
  kind: equivalence
  impl:
  - PGFData.poisson_excess_eq_mean
  - PGFData.poisson_variance_eq_mean
  - poisson_unique_exact_lift
  - excess_degree_decomposition
  supporting:
  - ebcm_to_meanfield_exact_iff_poisson
  impl_note: Only 2 ⇒ 3 (poisson_excess_eq_mean), 2 ⇒ 4 (poisson_variance_eq_mean) and (3 with mean = κ) ⇒ 4 (poisson_unique_exact_lift) are proved; 3 ⇔ 4 follows from excess_degree_decomposition but is not stated; item 1 is not formalised; 3 ⇒ 2 and 4 ⇒ 2 are false for genuine degree distributions and are only expressible in the two-moment PGFData record, where 'Poisson' collapses to secondFactorial = mean².
  required: true
  status: implemented
  notes: 'Ill-posed as written: F ∘ G(N) involves no network, so item 1 cannot be equivalent to properties of ''the underlying network''. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Theorem 4.3.** The following are equivalent: 1. F ∘ G(N) = N exactly (not just at equilibrium, but for all t) 2. The underlying network has a Poisson degree distribution 3. ψ''''(1)/ψ''(1) = ψ''(1) (excess degree equals mean degree) 4. The degree distribution has variance equal to its mean -- Replaces the false 4-way equivalence (P2.9). (a)/(b) at the level of two-moment records: PGFData.dispersionIndex_eq_one_iff, poisson_unique_exact_lift, poisson_excess_eq_mean; (c) is not formalised (P3.4).'
