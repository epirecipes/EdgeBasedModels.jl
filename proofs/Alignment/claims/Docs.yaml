  required: false
  status: missing
  notes: 'WP4b (TRIAGE P1.4/P2): text corrected; previous text: Given an EBCM object (θ, φ, R, ψ), define F on objects by: [...] F(θ, φ, R, ψ) = (S, I, R) where S_l = ψ_l(θ_{1l}, …, θ_{Kl}) (evaluate PGF at θ-vector) R_l = R_l (identity) I_l = 1 - S_l - R_l (derived) [...] On morphisms, F sends an edge-level semi-conjugacy h to its induced population-level semi-conjugacy F(h) = ψ ∘ h ∘ ψ^{-1} (where defined).'
- id: Docs.cf.prop3_1
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 79-81
  text: '**Proposition 3.1.** F preserves the ODE structure: if (θ(t), φ(t), R(t)) solves the EBCM system, then (S(t), I(t), R(t)) := F(θ(t), φ(t), R(t)) satisfies a closed ODE system on the simplex.'
  kind: dynamical
  impl: []
  supporting: []
  impl_note: Not formalised (no trajectories in the library).
  required: false
  status: missing
  notes: 'Doubtful as stated: dS/dt = −β ψ''(θ) φ_I with θ = ψ⁻¹(S), and φ_I is not a function of (S, I, R) in general, so the projection of a non-Poisson EBCM is not an autonomous ODE in (S, I, R); the sketch''s ''the right-hand side becomes a function of S, I, R alone'' is unjustified.'
- id: Docs.cf.thm3_2
  group: Docs
  source:
    file: categorical_foundations.md
    lines: 94-97
  text: '**Theorem 3.2.** F is not injective on EBCM states: distinct EBCM states (θ, φ, R, ψ) can have the same image (S, I, R), because F forgets φ and all of ψ except its value at θ. Whether distinct EBCM *trajectories* can project to identical node-level trajectories is not established here.'
  kind: structural
  impl:
  - coarseGrain_not_injective
  supporting: []
  impl_note: impl proves non-injectivity of coarseGrain on EpiModel records (objects), not non-faithfulness (a property of the action on morphisms) and nothing about trajectories.
  required: true
  status: implemented
  notes: 'The proof sketch argues the two EBCMs ''differ in transient dynamics'', i.e. project to different node trajectories, which does not establish the theorem. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Theorem 3.2.** F is not faithful: distinct EBCM trajectories can project to identical node-level trajectories.'
