  - static_limit_dim
  impl_note: 'DynamicEBCM has only the fields disease : SIRParams and pgf : PGFData — no rewiring rates η₁, η₂, no ODE and no limit; staticLimit is defined to be edgeModel m.disease m.pgf, so the ''collapse'' holds by definition at the EpiModel level only.'
