  kind: structural
  impl:
  - R0_rewiring_independent
  supporting: []
  impl_note: 'DynamicEBCM has only the fields disease : SIRParams and pgf : PGFData — no rewiring rates η₁, η₂, no ODE and no limit; so independence from a rewiring rate holds vacuously by construction. The theorem actually proves m.staticLimit.R0 = m.R0 (R₀ unchanged by the static-limit map). First fragment is the docstring of def DynamicEBCM.R0.'
