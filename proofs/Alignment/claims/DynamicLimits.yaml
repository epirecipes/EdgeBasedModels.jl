  status: missing
  notes: Module-header claim.
- id: DynamicLimits.header.fastRewiringCollapse
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 16-20
  text: '**Fast-rewiring limit (η → ∞)**: The network reshuffles so quickly that partnerships are fleeting. The system approaches the mean-field social-heterogeneity (MFSH) model of Miller, Slim & Volz (2012): nodes keep their degrees, so degree heterogeneity survives, and R₀ tends to (β/γ)⟨K²⟩/⟨K⟩.'
  kind: limit
  impl: []
  supporting:
  - fast_rewiring_dim
  impl_note: 'DynamicEBCM has only the fields disease : SIRParams and pgf : PGFData — no rewiring rates η₁, η₂, no ODE and no limit; fastRewiringLimit is defined as ⟨3, T·κ⟩.'
  required: false
  status: missing
  notes: 'Volz–Meyers (2007, eqs 2.22–2.23; papers/rspb20071159.md l.216-226) show the fast-mixing limit is a mass-action model that retains degree heterogeneity (Ṁ₁ = rM₁(θψ''(θ)+θ²ψ''''(θ))/ψ''(1) − μM₁), whose R₀ involves ψ''''(1)/ψ''(1). WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Fast-rewiring limit (η → ∞)**: The network reshuffles so quickly that edge correlations are destroyed at each instant. The system collapses to a **mean-field** model — only population-level aggregates (S, I, R) remain. -- Candidate impl for the R₀ part: DynamicEBCM.R0_edgeSwap_tendsto_mfsh.'
