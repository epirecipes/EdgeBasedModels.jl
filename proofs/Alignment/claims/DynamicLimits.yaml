- id: DynamicLimits.fastRewiringR0MeanDegree
  group: DynamicLimits
  source:
    file: EBCMCategory/DynamicLimits.lean
    lines: 98-100
  text: Its R₀ is (β/γ)⟨K²⟩/⟨K⟩ = (β/γ)(ψ''(1)/ψ'(1) + 1) (`R0_mfsh`), which keeps degree heterogeneity. The R₀ stored here, T·ψ'(1) = βκ/(β+γ), is not that limit; it is kept for compatibility (Results 36, 37).
  kind: limit
  impl: []
  supporting:
  - fast_rewiring_R0_poisson
  - fast_rewiring_R0_differs
  impl_note: Docstring of def DynamicEBCM.fastRewiringLimit; the def sets R0 := T·κ, so this is definitional (bridge material), not a derived result.
  required: false
  status: informal
  notes: 'Scientifically doubtful: in the Volz–Meyers (2007) fast-mixing limit the linearised growth rate is r(1 + ψ''''(1)/ψ''(1)) − μ, i.e. degree heterogeneity is retained (papers/rspb20071159.md eqs 2.22-2.23). Results 36-37 inherit this modelling choice. WP4b (TRIAGE P1.4/P2): text corrected; previous text: Crucially, R₀ now uses the **mean degree** κ rather than the excess degree ψ''''(1)/ψ''(1), because the fast-rewiring limit destroys the degree-heterogeneity amplification effect.'
