  notes: 'Contradicts the literature: Miller–Slim–Volz (2012) dynamic-network EBCMs give per-edge transmission probability β/(β+γ+η₂) and an R₀ that depends on the edge-turnover rate (papers/1106.6320v1.md l.608, l.640). The claim should be restated as ''the static-limit model has the same R₀ as defined here''. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Key result**: R₀ does NOT depend on the rewiring rate. [...] **Result 33.** R₀ is independent of the rewiring rate. -- Formerly a passing claim with false text (P2.3: R₀ depends on η). impl R0_rewiring_independent (staticLimit.R0 = R0) matches only the corrected ''stores'' reading; the η-dependence is DynamicEBCM.R0_edgeSwap_zero / R0_edgeSwap_tendsto_mfsh / R0_static_lt_mfsh.'
