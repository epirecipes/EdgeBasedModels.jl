  text: For a degree-correlated network, R₀ = T · ρ(D) where ρ(D) is the spectral radius (largest eigenvalue) of the next-generation matrix D_{kl} = (l − 1) · Q(l|k) (Wang, Ma, Cao and Li 2018, J Theor Biol).
