  group: DegreeCorrelation
  source:
    file: EBCMCategory/DegreeCorrelation.lean
    lines: 77-78
  text: Under neutral mixing, Q(l|k) = l·p_l/⟨k⟩, K has rank one and ρ(K) = ⟨k(k−1)⟩/⟨k⟩, which recovers Result 80.
  kind: algebraic-identity
  impl: []
  supporting: []
  impl_note: ''
  required: false
  status: missing
  notes: 'WP4: new text. True: K = u qᵀ with u_k = k − 1, q_l = l p_l/⟨k⟩, so ρ(K) = qᵀu = ⟨k(k−1)⟩/⟨k⟩ (checked numerically).'
