  text: 'Equivalently R₀ = T · ρ(K) with K_{kl} = (k − 1) · Q(l|k), the matrix used by the Julia `correlated_R0`: with Δ = diag(k − 1), D = QΔ and K = ΔQ have the same spectral radius.'
  kind: algebraic-identity
  impl: []
  supporting: []
  impl_note: ''
  required: false
  status: missing
