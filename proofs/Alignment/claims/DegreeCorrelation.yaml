  impl: []
  supporting: []
  impl_note: ''
  required: false
  status: missing
  notes: 'P1.2 + P2.6 (WP4): the content-free axiom correlated_R0_spectral (T * ρ = T * ρ) was deleted and the text corrected: the old matrix C_kl = k·Q(l|k) is off by one. D is the SIR/EBCM next-generation matrix of papers/degreecorrelation.md (linearisation φ′_k = −(β+γ)φ_k + β Σ_l (l−1)Q(l|k)φ_l, R₀ = β/(β+γ)·Λ_m). True (yes-lit); no Lean theorem (P3.5).'
