  supporting: []
  impl_note: impl proves the rate identity dE p inc + dI p + dR p = inc for an arbitrary rational 'inc'. SEIRState has no S field, no dS rate is defined, and no statement S + E + I + R = 1 (or its time-derivative form with dS = −inc) appears; 'excluding seed' has no formal counterpart.
  required: true
  status: implemented
  notes: Header-table row. Table text (algebraic conservation of the total) differs from the SEIR3 docstring (d(E+I+R)/dt = incidence).
