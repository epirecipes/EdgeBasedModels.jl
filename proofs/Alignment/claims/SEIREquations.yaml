- id: SEIREquations.seirIGrowthBounded-a
  group: SEIREquations
  source:
    file: EBCMCategory/SEIREquations.lean
    lines: 137-140
  text: '**SEIR5 (auxiliary; not a peak bound).** If σ·pop_E ≤ pop_E + pop_I, then dI/dt ≤ pop_E + pop_I − γ·pop_I. Since dI/dt = σ·pop_E − γ·pop_I, this only restates the hypothesis; it does not compare SEIR with SIR, and σ·pop_E can exceed the SIR incidence.'
  kind: inequality
  impl:
  - seir_I_growth_bounded
  supporting: []
  impl_note: 'impl: under hypothesis σ·pop_E ≤ pop_E + pop_I, dI ≤ pop_E + pop_I − γ·pop_I (linarith from the hypothesis). No SIR model and no incidence appear; the right-hand side is not an SIR growth rate (an SIR dI would be inc − γ·I), and the hypothesis is essentially the conclusion.'
  required: true
  status: implemented
  notes: 'Suspicious: the formal statement bears no recognisable relation to the text. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **SEIR5.** At the same incidence, SEIR''s I growth rate is lower than SIR''s because SEIR''s inflow to I comes from E (rate σ·E) rather than directly from incidence.'
