  impl_note: 'impl compares two literal PGFEval records (1,1,1) and (5/8,1/2,1). These are indeed (ψ, ψ'', ψ'''') of ψ = ½ + θ²/2 at θ = 1 and θ = ½ (checked with sympy: κ(θ) = (1+θ²)/(2θ²)), but neither the mixture nor θ appears in the statement.'
