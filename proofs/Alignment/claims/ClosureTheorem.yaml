- id: ClosureTheorem.header.closureExact
  group: ClosureTheorem
  source:
    file: EBCMCategory/ClosureTheorem.lean
    lines: 18-21
  text: 'The pairwise model approximates triples in terms of pairs: [ASI] = kappa * [AS][SI] / [S] where kappa = psi''''(theta) psi(theta) / psi''(theta)^2. This closure is exact (N -> infinity) iff kappa is constant for all theta.'
  kind: equivalence
  impl: []
  supporting:
  - closure_ode_gives_ratio
  impl_note: No pairwise model, triples, closure exactness or N→∞ limit is formalised.
  required: false
  status: missing
  notes: Module-header claim.
- id: ClosureTheorem.header.verificationStrategy
  group: ClosureTheorem
  source:
    file: EBCMCategory/ClosureTheorem.lean
    lines: 25-30
  text: 'We check the sufficiency identities for PT families: for each PT family, the values psi(theta), psi''(theta), psi''''(theta) of its PGF, written as monomials in free scalars, satisfy psi'''' psi = kappa (psi'')^2 as ring identities. The necessity direction of KKR Theorem 1 (only PT laws have constant kappa) is not formalised; we only exhibit one non-PT law, psi = 1/2 + theta^2/2, whose ratio kappa(theta) takes two different values.'
  kind: algebraic-identity
  impl:
  - poisson_closure_ode
  - binomial_closure_ode
  - negbin_general_closure_ode
  - nonPT_closure_ratio_varies
  supporting: []
  impl_note: 'Conjunction: Poisson, Binomial(n+2) and NegBin(m+1) identities plus two literal PGFEval records with different ratios. ''Each PT family'' is covered only for Binomial with n ≥ 2 and NegBin with integer r ≥ 1 (real r > 0 is not). ψ, ψ'', ψ'''' are supplied as explicit expressions in free variables (w or psi_val) inside a PGFEval record; nothing derives them as derivatives of the family''s PGF (no deriv/HasDerivAt), so ''at every θ'' is represented only by universally quantifying the free variable. The ''converse'' (non-constant κ ⇒ not exact / ODE ⇒ PT) is not formalised; a single non-PT example is not a converse.'
  required: true
  status: implemented
  notes: 'Module-header meta-claim. WP4b (TRIAGE P1.4/P2): text corrected; previous text: We verify the closure ODE psi'''' psi = kappa (psi'')^2 algebraically for each PT family at every point theta. For the converse, we exhibit a non-PT distribution where kappa varies.'
