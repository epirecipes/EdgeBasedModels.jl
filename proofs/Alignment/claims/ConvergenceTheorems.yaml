  required: false
  status: missing
  notes: 'AMBIGUITY: I is undefined. Checked by hand/sympy: with S = exp(κ(θ-1)), dS/dt = κSθ̇ = -κβ̃·S·φ_I where φ_I = θ - S - (γ̃/β̃)(1-θ) (Miller edge variable = Rempala x_D/µ). So the identity holds with I := φ_I, not with I = infected node fraction. WP4b (TRIAGE P1.4/P2): text corrected; previous text: Key algebraic identity: the Poisson EBCM ODE θ̇ = -β̃ θ + β̃ exp(κ(θ-1)) + γ̃(1-θ) reduces to dS/dt = -β S I when S = exp(κ(θ-1)).'
