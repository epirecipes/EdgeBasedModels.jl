  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 341-349
  text: 'For SIR epidemics on configuration-model random graphs with bounded degrees and an arbitrary infectious-period distribution, the final size Z_n satisfies √n(Z_n/n − ρ) ⇒ N(0, σ²) with an explicit σ² (so Z_n/n → ρ in probability) in any of three regimes (Ball 2021): the initially infected fraction converges to a limit ε ∈ (0, 1) (Theorem 2.1); R₀ > 1, the number of initial infectives is fixed, and the statement is conditional on a major outbreak, of size at least log n (Theorem 2.2); or R₀ > 1 and the number of initial infectives tends to infinity while their fraction tends to zero, without conditioning (Theorem 2.3).'
  kind: limit
  impl: []
  supporting: []
  impl_note: ''
  required: false
  status: missing
