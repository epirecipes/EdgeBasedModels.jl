- id: ConvergenceTheorems.R106.header
  group: ConvergenceTheorems
  source:
    file: EBCMCategory/ConvergenceTheorems.lean
    lines: 125-131
  text: 'On tree networks (no cycles), the pair approximation is exact. Precisely (Sharkey, Kiss, Wilkinson and Simon 2015, Theorem 1.1): for Markovian SIR dynamics on a network whose underlying graph is a tree, started from a pure state (or from uncorrelated initial node states), the individual-level closure (A_i S_j B_k)·(S_j) = (A_i S_j)·(S_j B_k) holds exactly for every triple in the pair equations, so the closed pair-based system reproduces the exact node and pair probabilities.'
  kind: dynamical
  impl: []
  supporting: []
  impl_note: ''
  required: false
  status: missing
  notes: 'P1.1 (WP4): the inconsistent axiom tree_pair_exactness (unconstrained classes TreeNetwork, PairClosureError; instances ⟨True⟩, ⟨1⟩ on Unit gave (1 : ℝ) = 0) was deleted with its classes. The text now states the published theorem (papers/s11538-013-9923-5.md, Theorem 1.1); the citation was corrected from Sharkey, Kiss, Maybank, Sherborne (2013) to Sharkey, Kiss, Wilkinson, Simon (2015), Bull Math Biol 77:614-645. Established result (yes-lit); no Lean theorem (coverage gap, not planned for this legacy tree).'
