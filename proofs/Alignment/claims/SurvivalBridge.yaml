  impl:
  - survival_map_R0_poisson
  supporting: []
  impl_note: 'impl: (edgeModel p (PGFData.poisson κ hκ)).R0 = (nodeModel p κ).R0, i.e. T·excessDegree = T·κ; ''DSA'' R₀ is represented by nodeModel.R0 = T·κ = β·μ/(β+γ). Matches for Poisson.'
  required: true
  status: implemented
  notes: 'WP4b (TRIAGE P1.4/P2): text corrected; previous text: Here we prove the algebraic identity that the two R₀ formulations agree: the EBCM uses T·ψ''''(1)/ψ''(1) while DSA uses β·μ/(β+γ) where μ = mean degree. For Poisson, these are the same.'
