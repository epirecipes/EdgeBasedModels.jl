- id: SurvivalBridge.header.ptCharacterisation
  group: SurvivalBridge
  source:
    file: EBCMCategory/SurvivalBridge.lean
    lines: 11-14
  text: '**Poisson-type characterisation** (Theorem 1): The pairwise closure is exact iff the degree distribution is Poisson, Binomial, or Negative Binomial — collectively called "Poisson-type" (PT) distributions. These are exactly the distributions whose PGF satisfies ψ''(u) = α·ψ(u)^κ.'
  kind: equivalence
  impl: []
  supporting:
  - poisson_kappa_eq_one
  - binomial_kappa_lt_one
  - negbin_kappa_gt_one
  impl_note: 'No theorem: there is no notion of pairwise-closure exactness, of a PGF as a function, or of the ODE ψ'' = α·ψ^κ in the module.'
  required: false
  status: missing
  notes: Module-header claim.
