  text: '**Result 47.** For Poisson networks (κ=1), the DSA survival equation has the form of the classical mass-action SIR survival equation, with rescaled rates. From Eq (33) of the paper, with κ=1: -dS/dt = β̃(S - S²) + γ̃·S·log(S) + ρ̃·S This has the form of the mass-action SIR survival equation of KhudaBukhsh et al. (2020), with β̃ = μβ, γ̃ = β + γ and ρ̃ = βμρ. The Lean theorem proves only that the Poisson record has closureKappa = 1.'
  kind: dynamical
  impl:
  - poisson_closure_is_one
  supporting: []
  impl_note: impl is literally Result 42 (closureKappa (PGFData.poisson κ) = 1); no ODE, survival function S, parameters β̃/γ̃/ρ̃, logarithm or mass-action model appears.
  required: true
  status: implemented
  notes: 'Suspicious: dynamical reduction claim implemented by a moment identity. Eq. (33) with κ=1 matches KKR 2023 (papers/s00285-023-01967-9.md l.324), where β̃, γ̃, ρ̃ are re-scaled parameters, so ''reduces to the classical mass-action SIR'' holds only in form, not with the network''s β, γ. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result 47.** For Poisson networks (κ=1), the DSA survival equation reduces to the classical mass-action SIR. From Eq (33) of the paper, with κ=1: -dS/dt = β̃(S - S²) + γ̃·S·log(S) + ρ̃·S This is exactly the mass-action SIR survival equation from KhudaBukhsh et al. (2020).'
