# Conventions
#   id       <Group>.R<N>[a|b|...]  for a '**Result N.**' docstring (split parts get a letter suffix,
#            or '.1', '.2', ... when the Result label already ends in a letter, e.g. R105c.2);
#            <Group>.<lowerCamelDeclName>[.a|.b]  for other docstrings;
#            <Group>.header.<slug> / <Group>.table.<row>  for module-header / header-table claims
#            that have no docstring of their own.
#   text     VERBATIM (whitespace-normalised) quote; fragments separated by a line '[...]'.
#            Lean comment delimiters (/--, /-!, -/) are not part of the text.
#   status   implemented  -> impl lists trusted theorems; required: true
#            axiomatized  -> impl lists the 'axiom' declaration(s); audit reports impl_unsound
#            missing      -> checkable claim with no implementing theorem (coverage gap)
