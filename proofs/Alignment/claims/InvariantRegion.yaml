  impl:
  - InvariantRegion.explicit_seed_initial_conservation
  supporting:
  - InvariantRegion.pgf_eval_one
  impl_note: impl proves the ring identity (1-ρ) + ρ + 0 = 1 over ℚ; θ(0) = 1, the observable (1-ρ)ψ(θ), the PGF and ψ(1) = 1 (pgf_eval_one) are not mentioned.
  required: true
  status: implemented
  notes: The Julia seed convention (uncommitted EBM change S_pop ~ q*psi(theta), q = 1-ρ) is not referenced formally.
