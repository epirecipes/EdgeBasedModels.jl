- id: InvariantRegion.header.model
  group: InvariantRegion
  source:
    file: EBCMCategory/InvariantRegion.lean
    lines: 20-37
  text: 'The expanded single-type SIR EBCM (Volz 2008, Miller 2011) has ODE variables θ, φ_I, φ_R, R with the vector field: dθ/dt = −β φ_I dφ_I/dt = β φ_I ψ″(θ) / ψ′(1) − (β + γ) φ_I dφ_R/dt = γ φ_I dR/dt = γ (1 − ψ(θ) − R) (The φ_I equation follows from φ_I = θ − φ_S − φ_R with φ_S = ψ′(θ)/ψ′(1); it is the form the Julia builders integrate. Several statements below were written for the incorrect form (β φ_I / θ)(ψ′(θ) / ψ′(1)) − (β + γ) φ_I; the corresponding statements for the correct form are `phi_I_dot_correct_*`.) Derived observables (algebraic, not ODE variables): S = ψ(θ) I = 1 − S − R ← by definition; so S + I + R = 1 identically φ_S = ψ′(θ)/ψ′(1)'
  kind: structural
  impl: []
  supporting: []
  impl_note: Model description only; there is no Lean definition of the vector field -- theorems use inline expressions over free rationals.
  required: false
  status: informal
  notes: 'CORRECTNESS: the dφ_I/dt equation is wrong. From φ_I = θ - φ_S - φ_R with φ_S = ψ′(θ)/ψ′(1) (Miller 2011; also src/builders.jl, which uses ψ″(θ)/ψ′(1)), dφ_I/dt = β φ_I ψ″(θ)/ψ′(1) - (β+γ) φ_I, not (β φ_I/θ)(ψ′(θ)/ψ′(1)) - (β+γ) φ_I; they agree only when θψ″(θ) = ψ′(θ) (2-regular). Poisson (sympy): header coefficient e^{κ(θ-1)}/θ vs correct κe^{κ(θ-1)}. Theorems using this form (R117a, phiIDotFactors) only use proportionality to φ_I, so they remain true, but the stated ODE is wrong. Also, under the seed convention of R120b, S = (1-ρ)ψ(θ), not ψ(θ). WP4b (TRIAGE P1.4/P2): text corrected; previous text: The expanded single-type SIR EBCM (Volz 2008, Miller 2011) has ODE variables θ, φ_I, φ_R, R with the vector field: dθ/dt = −β φ_I dφ_I/dt = (β φ_I / θ)(ψ′(θ) / ψ′(1)) − (β + γ) φ_I dφ_R/dt = γ φ_I dR/dt = γ (1 − ψ(θ) − R) Derived observables (algebraic, not ODE variables): S = ψ(θ) I = 1 − S − R ← by definition; so S + I + R = 1 identically φ_S = ψ′(θ)/ψ′(1)'
