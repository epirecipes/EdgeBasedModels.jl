  impl_note: (ClosureFamily.mk C₃).IsKirkwoodForm ∧ algebraicGap MℝLinCLM F4Kℝ C₃ u₁ = 0 for the explicit C₃ v = fun _ => 3 * (v .c)^2 / 8.
  required: true
  status: implemented
  notes: 'WP4b: new corrected trusted theorem (TRIAGE P1.4/P2). NEEDS BLIND SHADOWS (no sa_claim yet).'
