  impl:
  - EBCMCategory.MarginalisationDynamicalGap.trajectoryGap_rate_two_at_witness
  supporting: []
  impl_note: 'impl: IsFlow F4Kℝ φ₄ → IsFlow F3Kℝ φ₃ → HasDerivAt (trajectoryGap MℝLinCLM φ₄ φ₃ u₁) (fun _ => 2) 0 -- matches "rate 2 at t = 0" (HasDerivAt ≡ 2t·ê_c + o(t) since the gap vanishes at 0), but the hypothesis IsFlow F3Kℝ φ₃ is unsatisfiable.'
