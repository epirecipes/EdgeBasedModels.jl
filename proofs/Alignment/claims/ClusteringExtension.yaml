- id: ClusteringExtension.R75-sec
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 144-147
  text: 'For independent Poisson single/triangle edges with means κ_s, κ_t: g(x,y) = exp(κ_s(x-1) + κ_t(y-1)). The triangle stub fraction equals 2κ_t/(2κ_t + κ_s); the clustering coefficient is 2⟨t⟩/⟨k(k−1)⟩ = 2κ_t/((κ_s + 2κ_t)² + 2κ_t).'
  kind: algebraic-identity
  impl:
  - poisson_clustering
  supporting: []
  impl_note: 'impl: 2κ_t/(2κ_t+κ_s) = clustering_coefficient ⟨κ_s, κ_t, κ_s, …⟩ — an unfolding of the definition for a record whose means are κ_s, κ_t. The PGF exp(κ_s(x−1)+κ_t(y−1)) and the Poisson assumption play no role (it holds for any law with those means). The record''s excess_single is set to κ_s, whereas for this PGF ⟨s(s−1)⟩/⟨s+2t⟩ = κ_s²/(κ_s+2κ_t) (irrelevant to C).'
  required: true
  status: implemented
  notes: 'Under the literature definition (C = 2⟨t⟩/⟨k(k−1)⟩) the Poisson value would be 2κ_t/((κ_s+2κ_t)² + 2κ_t) (sympy, from g_y(1,1)/(½G′′(1))), not 2κ_t/(2κ_t+κ_s). WP4b (TRIAGE P1.4/P2): text corrected; previous text: For independent Poisson single/triangle edges with means κ_s, κ_t: g(x,y) = exp(κ_s(x-1) + κ_t(y-1)). The clustering coefficient equals 2κ_t/(2κ_t + κ_s).'
