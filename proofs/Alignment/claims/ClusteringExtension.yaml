- id: ClusteringExtension.R69
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 34-40
  text: '**Result 69.** The triangle stub fraction 2⟨t⟩/(2⟨t⟩+⟨s⟩): the fraction of stubs that are triangle stubs (named `clustering_coefficient` for compatibility). It is not the clustering coefficient, which is C = 2⟨t⟩/⟨k(k−1)⟩ with k = s + 2t (the fraction of connected triples that are closed); for independent Poisson single and triangle degrees with means κ_s, κ_t, C = 2κ_t/((κ_s + 2κ_t)² + 2κ_t).'
  kind: structural
  impl: []
  supporting:
  - clustering_in_unit_interval
  impl_note: Def docstring of clustering_coefficient (it spells out the body); definitional, bridge material.
  required: false
  status: informal
  notes: 'Suspicious definition: Volz et al. (2011) (papers/clustering1.md l.73-75) define C = 3N_Δ/N_3 = g_y(1,1)/(½G''''(1)) with G(x) = g(x,x²), i.e. C = 2⟨t⟩/⟨k(k−1)⟩; the module''s 2⟨t⟩/(2⟨t⟩+⟨s⟩) = 2⟨t⟩/⟨k⟩ is the fraction of edge-ends lying in triangles, which that paper uses only to calibrate the HK model. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result 69.** Clustering coefficient C = 2⟨t⟩/(2⟨t⟩+⟨s⟩).'
