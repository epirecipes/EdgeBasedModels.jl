- id: ClusteringExtension.R72
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 99-105
  text: '**Result 72.** The scalar `clustered_R0` = T·(⟨s(s-1)⟩/⟨s+2t⟩) + T·(2⟨t⟩/⟨s+2t⟩)·(1+T), kept for compatibility. It is not the R₀ of a clustered network: its triangle term does not scale with the excess triangle degree. For triangle-clustered configuration models, R₀ is the spectral radius of the next-generation matrix over single-edge and triangle-edge infection types (Miller 2009); it is not formalised here.'
  kind: algebraic-identity
  impl: []
  supporting: []
  impl_note: clustered_R0 is a definition; no theorem connects it to an epidemic threshold or to a clustered EBCM.
  required: false
  status: missing
  notes: 'Suspicious formula: the triangle term does not depend on the excess triangle count and cross moments ⟨st⟩ are absent. E.g. with ⟨s(s−1)⟩ = 0 (s ∈ {0,1}), every node in exactly one triangle and ⟨s⟩ → 0, clustered_R0 → T(1+T) = 2 at T = 1, although such near-disjoint triangles cannot sustain a large outbreak. Also excess_single is a free field unrelated to mean_single. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result 72.** R₀ for a clustered network: R₀ = T·(⟨s(s-1)⟩/⟨s+2t⟩) + T·(2⟨t⟩/⟨s+2t⟩)·(1+T).'
- id: ClusteringExtension.R73-sec-a
  group: ClusteringExtension
  source:
    file: EBCMCategory/ClusteringExtension.lean
    lines: 112-116
  text: Converting a triangle (⟨t⟩→⟨t⟩-1) to two single edges (⟨s⟩→⟨s⟩+2) preserves mean degree ⟨k⟩ = ⟨s⟩+2⟨t⟩. In the scalar formula `clustered_R0`, a triangle's two stubs contribute T·(1+T) in total, i.e. T(1+T)/2 per stub, which is at most the contribution T of a single-edge stub. This is a statement about that formula, not a derivation of R₀ for clustered networks.
  kind: inequality
  impl: []
  supporting:
  - triangle_per_edge_le_single
  - degree_conversion_preserves_mean
  impl_note: No theorem compares clustered_R0 before and after the conversion.
  required: false
  status: missing
  notes: 'Reasoning is self-contradictory as written (''T·(1+T) > T'' is offered as the reason R₀ is LOWER); with the module''s clustered_R0 the comparison would also depend on the free field excess_single. WP4b (TRIAGE P1.4/P2): text corrected; previous text: Converting a triangle (⟨t⟩→⟨t⟩-1) to two single edges (⟨s⟩→⟨s⟩+2) preserves mean degree ⟨k⟩ = ⟨s⟩+2⟨t⟩ but the triangle contribution T·(1+T) > T alone, so the original clustered R₀ is LOWER than the unclustered one because the triangle terms contribute less per mean degree.'
