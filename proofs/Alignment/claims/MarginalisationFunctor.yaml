  status: implemented
  notes: 'Vacuous at the Kirkwood order-3 witness: F₃(c) = c²/4 has no global flow (c(t) = 4/(1-t) from c(0) = 4 blows up at t = 1; IsFlow quantifies over all t ∈ ℝ), so IsFlow F₃ φ₃ is unsatisfiable there. So T1 cannot be instantiated at the intended Kirkwood example. WP4b (TRIAGE P1.4/P2): text corrected; previous text: we prove (Theorem T1) the precise dynamical characterisation: *Trajectory-level marginalisation* `M ∘ φ₄(·,t) = φ₃(M·, t)` for all `(u, t)` is **equivalent** to *infinitesimal* marginalisation `M ∘ F₄ = F₃ ∘ M`.'
