  text: '**Result M1.** Pushing a flow of `F₄` through a continuous linear `M` gives a solution of `F₃` through `M u` whenever the RHS commute. It is *the* solution only if solutions of `F₃` are unique.'
  kind: dynamical
  impl:
  - EBCMCategory.Marginalisation.pushforward_isSolution
  supporting: []
  impl_note: 'impl: (∀u, M (F₄ u) = F₃ (M u)) → IsFlow F₄ φ₄ → IsSolution F₃ (M u) (t ↦ M (φ₄ u t)). The conclusion is "a solution of F₃ from M u", not "the flow of F₃", and there is NO hypothesis that a flow of F₃ exists (impl has fewer hypotheses than the text).'
  required: true
  status: implemented
  notes: 'WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result M1.** Pushing a flow of `F₄` through a continuous linear `M` gives the flow of `F₃` whenever the RHS commute, *provided* a flow of `F₃` is already known to exist.'
