- id: Obstructions.header.standardAssumptions
  group: Obstructions
  source:
    file: EBCMCategory/Obstructions.lean
    lines: 6-9
  text: 'The **standard** EBCM (4 ODE variables, single θ) rests on three assumptions: 1. The network is a **configuration model** (tree-like local structure) 2. Disease transitions are **Markovian** (exponential waiting times) 3. Initial infections are **uniform** (i.i.d. across nodes)'
  kind: structural
  impl: []
  supporting:
  - standard_ebcm_valid
  impl_note: Encoded definitionally by standardEbcmValid (a conjunction of three constructor equalities); to be checked by a bridge rather than a theorem.
  required: false
  status: informal
  notes: Module-header modelling statement.
- id: Obstructions.header.networkNotObstruction
  group: Obstructions
  source:
    file: EBCMCategory/Obstructions.lean
    lines: 14-17
  text: 'Network structure (assumption 1) For the specific network classes below an EBCM variant is known, at a dimension cost; this is a literature summary, not a statement about network structure in general:'
  kind: existence
  impl:
  - clustering_ebcm_exists
  - degreeCorr_ebcm_exists
  - multiplex_ebcm_exists
  supporting:
  - standard_most_compact
  - clustering_dimension_cost
  impl_note: Each impl is ebcmExists net .markovian .uniform for one non-standard network type, which unfolds to .uniform = .uniform (rfl); ebcmExists ignores its network argument, so 'not an obstruction' holds by definition. Only Markovian transitions are covered; the dimension cost is a hard-coded table.
  required: true
  status: implemented
  notes: 'Module-header section claim. WP4b (TRIAGE P1.4/P2): text corrected; previous text: Network structure (assumption 1) Not an obstruction at all — just a dimension cost:'
- id: Obstructions.header.clusteringAddsVariables
  group: Obstructions
  source:
    file: EBCMCategory/Obstructions.lean
    lines: 18-20
  text: '**Clustering** (triangles): the triangle EBCM of Volz, Miller, Galvani & Meyers (2011) tracks line states φ_X and triangle states φ_{XY} on configuration-model networks with triangles; their system has 7 ODEs.'
  kind: inequality
  impl: []
  supporting:
  - clustering_dimension_cost
  impl_note: No theorem states the increment; the hard-coded extensionDim table gives 13 − 4 = 9 extra variables for clustered vs configuration-model (Markovian). No triangle EBCM or φ_{XY} is formalised.
  required: false
  status: missing
  notes: 'Attribution: the references list Miller (2009, JRSI 6) for clustering; ''Koch & Britton (2018)'' is listed as an SEIR static/dynamic-network paper; not verified against the papers corpus. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Clustering** (triangles): Triangle EBCM of Koch & Britton (2018) tracks joint triangle-neighbour states φ_{XY}. Adds ~10 ODE variables.'
