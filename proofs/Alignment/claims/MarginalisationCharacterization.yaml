- id: MarginalisationCharacterization.existsEquivariantIffFibrewise
  group: MarginalisationCharacterization
  source:
    file: EBCMCategory/MarginalisationCharacterization.lean
    lines: 280-282
  text: '**Fibre criterion.** For any field `F` on `V₄`, some order-3 field `F₃` satisfies `M ∘ F = F₃ ∘ M` iff `F` maps each fibre of `M` into a single fibre: `M u = M u'' → M (F u) = M (F u'')`.'
  kind: equivalence
  impl:
  - EBCMCategory.MarginalisationCharacterization.exists_equivariant_iff_fibrewise
  supporting: []
  impl_note: (∃ F₃, Equivariant M F F₃) ↔ ∀ u u', M u = M u' → M (F u) = M (F u'), for any ℝ-modules and any F (uses Classical.choice).
  required: true
  status: implemented
  notes: 'WP4b: new corrected trusted theorem (TRIAGE P1.4/P2). NEEDS BLIND SHADOWS (no sa_claim yet).'
- id: MarginalisationCharacterization.linearAdmitsEquivariantIff
  group: MarginalisationCharacterization
  source:
    file: EBCMCategory/MarginalisationCharacterization.lean
    lines: 302-304
  text: '**Theorem T3a (corrected).** A linear field `L₄` admits an order-3 field `F₃` with `M ∘ L₄ = F₃ ∘ M` iff `L₄` maps `ker M` into `ker M`. So linear closures are *not* equivariant for every linear `M`.'
  kind: equivalence
  impl:
  - EBCMCategory.MarginalisationCharacterization.linear_admits_equivariant_iff
  supporting: []
  impl_note: (∃ F₃, Equivariant M L₄ F₃) ↔ ∀ u, M u = 0 → M (L₄ u) = 0. The 'not for every M' sentence is a consequence, not a separate statement.
  required: true
  status: implemented
  notes: 'WP4b: new corrected trusted theorem (TRIAGE P1.4/P2). NEEDS BLIND SHADOWS (no sa_claim yet).'
