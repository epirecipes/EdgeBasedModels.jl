- id: VolzMeyersEquations.header.popIEquation
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 29-92
  text: |-
    | pop_I | = β P₁ θ ψ'(θ) − γ pop_I |
    [...]
    The Lean incidence β·P₁·θ·κ. The Volz–Meyers incidence is β·P₁·θ·ψ'(θ); for Poisson, ψ'(θ) = κ·ψ(θ), so it is β·P₁·θ·κ·ψ(θ). This definition drops the factor ψ(θ) and agrees with the model only while ψ(θ) = 1, i.e. at θ = 1.
  kind: dynamical
  impl: []
  supporting:
  - population_influx
  impl_note: 'dI s p := incidence − γ·I with incidence := β·P₁·θ·κ. For Poisson ψ''(θ) = κ·ψ(θ), so the table''s β·P₁·θ·ψ''(θ) equals β·P₁·θ·κ·ψ(θ): the def drops the factor ψ(θ) = S and agrees with the table only at θ = 1 (or for ψ(x) = x).'
  required: false
  status: missing
  notes: 'Second fragment is the docstring of def VMState.incidence; the two fragments are mutually inconsistent. WP4b (TRIAGE P1.4/P2): text corrected; previous text: | pop_I | = β P₁ θ ψ''(θ) − γ pop_I | [...] Incidence = β·P₁·θ·κ (for Poisson, ψ''(θ) = κ·ψ(θ)).'
