- id: VolzMeyersEquations.header.equationLevel
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 7-13
  text: 'This file states scalar identities motivated by the **Volz–Meyers (2007) neighbour-exchange (NE) model**: sign conditions and conservation identities for pointwise right-hand-side expressions, and initial-condition bookkeeping. No full ODE system is formalised: only the θ, pop_I and pop_R right-hand sides are defined, as scalar expressions of a state record; the P_S, P₁ and M₁ equations are not, and nothing is proved about solutions.'
  kind: structural
  impl: []
  supporting:
  - theta_nonincreasing
  - population_influx
  - fast_mixing_P1_equilibrium
  impl_note: Only the rate expressions dθ, incidence (Poisson-specialised), dI, dR and the derived P_R are defined; the P_S, P₁ and M₁ equations of VM Table 4 are absent, S = ψ(θ) is absent, and no ODE solution or limit is formalised ('limiting behaviour' results VM5/VM6 are algebraic evaluations at ρ = 0 or under P₁ = M₁).
  required: false
  status: missing
  notes: 'Module-header meta-claim. WP4b (TRIAGE P1.4/P2): text corrected; previous text: This file formalises the **Volz–Meyers (2007) neighbour-exchange (NE) model** at the ODE equation level, providing machine-checked guarantees about conservation laws, limiting behaviour, and initial-condition consistency. [...] by verifying the actual ODE system'
