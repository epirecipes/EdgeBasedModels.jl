- id: CategoricalComposition.R96c
  group: CategoricalComposition
  source:
    file: EBCMCategory/CategoricalComposition.lean
    lines: 115-122
  text: '**Result 96c.** The sum T₁e₁ + T₂e₂ of the per-layer R₀ values; it matches the former compact implementation in `src/multiplex.jl`. It is not the R₀ of independent multiplex layers, which is ρ(K) with K = [[T₁e₁, T₁⟨k₁⟩], [T₂⟨k₂⟩, T₂e₂]] and eᵢ = ψᵢ''''(1)/ψᵢ''(1) (`MultiplexProduct.K11` …). The sum T₁e₁ + T₂e₂ equals ρ(K) iff det K = 0, i.e. e₁e₂ = ⟨k₁⟩⟨k₂⟩, for example for two Poisson layers; it underestimates ρ(K) when e₁e₂ < ⟨k₁⟩⟨k₂⟩. Two 3-regular layers with T = 6/25 give sum 24/25 but ρ(K) = 6/5 (`multiplex_R0_sum_ne_spectral`).'
  kind: algebraic-identity
  impl: []
  supporting: []
  impl_note: Docstring of the DEFINITION MultiplexProduct.R0_sum (:= layer1.R0 + layer2.R0); no theorem relates it to the multiplex R₀.
  required: false
  status: missing
  notes: 'CORRECTNESS (also affects src/multiplex.jl multiplex_R0): for independent layers on shared nodes the next-generation matrix is K = [[T₁e₁, T₁⟨k₁⟩], [T₂⟨k₂⟩, T₂e₂]] (e_i = ψ_i″(1)/ψ_i′(1)); R₀ = ρ(K) equals T₁e₁ + T₂e₂ iff det K = T₁T₂(e₁e₂ - ⟨k₁⟩⟨k₂⟩) = 0 (e.g. both layers Poisson). Example (sympy): 4-regular + 2-regular layers, T₁ = T₂ = 1/2: sum = 2, ρ(K) = 2.5. The additive formula underestimates R₀ in general. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result 96c.** Product R₀ for independent multiplex layers adds the per-layer contributions, matching the compact implementation in `src/multiplex.jl`. -- The corrected text is implemented (for the counterexample) by multiplex_R0_sum_ne_spectral; MultiplexProduct.R0_sum_eq_trace records sum = tr K.'
