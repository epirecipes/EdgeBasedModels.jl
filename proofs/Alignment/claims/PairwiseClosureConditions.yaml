claims:
- id: PairwiseClosureConditions.header.safeRegime
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 9-21
  text: 'If a closed triple is written in the form `[ASI]_A = B * p_A` where `B = (n - 1)[SI]` is a nonnegative base term and the weights `p_A` satisfy * `∑_A p_A = 1`, * `p_A ≥ 0` for every state `A`, then two things follow: 1. the total triple mass is conserved: `∑_A [ASI]_A = B`, 2. each triple count is nonnegative.'
  kind: structural
  impl:
  - PairwiseClosureConditions.normalized_nonnegative_closure_safe
  supporting:
  - PairwiseClosureConditions.triple_mass_conserved
  - PairwiseClosureConditions.triple_term_nonneg
  impl_note: 'impl: for finite α, base ≥ 0, p ≥ 0 pointwise, ∑ p = 1: (∑ a, tripleTerm base p a = base) ∧ (∀ a, 0 ≤ tripleTerm base p a) over ℚ, with tripleTerm base p a := base·p a. The base is arbitrary (not tied to (n-1)[SI]).'
  required: true
  status: implemented
  notes: One claim with two conclusions under shared hypotheses; shadows may split the conjuncts.
- id: PairwiseClosureConditions.header.normalizationOnly
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 23-23
  text: The first conclusion only needs normalization.
  kind: structural
  impl:
  - PairwiseClosureConditions.triple_mass_conserved
  supporting: []
  impl_note: 'impl: the only hypothesis on p is ∑ p = 1 (no sign condition on p or on base).'
  required: true
  status: implemented
  notes: ''
- id: PairwiseClosureConditions.header.nonnegNeedsPointwise
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 23-24
  text: The second additionally needs pointwise nonnegativity of the weights.
  kind: structural
  impl:
  - PairwiseClosureConditions.triple_term_nonneg
  - PairwiseClosureConditions.negative_weight_gives_negative_triple
  supporting: []
  impl_note: 'Sufficiency: triple_term_nonneg (0 ≤ base, ∀ b, 0 ≤ p b ⇒ 0 ≤ tripleTerm base p a; normalization unused). Necessity only in the pointwise sense: negative_weight_gives_negative_triple (0 < base, p a < 0 ⇒ tripleTerm base p a < 0).'
  required: true
  status: implemented
  notes: ''
- id: PairwiseClosureConditions.header.conservationNotPositivity
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 24-26
  text: 'This is exactly the distinction that matters for auditing clustered pairwise closures: conservation alone does not imply positivity.'
  kind: existence
  impl:
  - PairwiseClosureConditions.negative_weight_gives_negative_triple
  supporting: []
  impl_note: impl shows a negative weight with positive base yields a negative triple. It does not exhibit normalized weights (∑ p = 1) with a negative entry, so the non-implication "normalization ⇏ nonnegativity" is only implicit.
  required: true
  status: implemented
  notes: Forward check against a shadow "∃ α p base, ∑ p = 1 ∧ ∃ a, tripleTerm base p a < 0" should fail (no existence statement).
- id: PairwiseClosureConditions.tripleMassConserved
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 58-59
  text: Normalization of the closure weights is enough to conserve the total triple mass. No sign condition on `p` is needed for this statement.
  kind: algebraic-identity
  impl:
  - PairwiseClosureConditions.triple_mass_conserved
  supporting: []
  impl_note: 'impl: ∑ p = 1 → ∑ a, tripleTerm base p a = base, for any base : ℚ and p : α → ℚ.'
  required: true
  status: implemented
  notes: ''
- id: PairwiseClosureConditions.tripleTermNonneg
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 72-73
  text: If the base term and all closure weights are nonnegative, then every closed triple term is nonnegative.
  kind: inequality
  impl:
  - PairwiseClosureConditions.triple_term_nonneg
  supporting: []
  impl_note: 'impl: 0 ≤ base → (∀ b, 0 ≤ p b) → 0 ≤ tripleTerm base p a.'
  required: true
  status: implemented
  notes: ''
- id: PairwiseClosureConditions.weightInUnitInterval
  group: PairwiseClosureConditions
  source:
    file: EBCMCategory/PairwiseClosureConditions.lean
    lines: 81-82
  text: Under nonnegative normalized weights, each individual closure weight lies in `[0,1]`.
  kind: inequality
  impl:
  - PairwiseClosureConditions.weight_in_unit_interval
  supporting: []
  impl_note: 'impl: (∀ b, 0 ≤ p b) → ∑ b, p b = 1 → 0 ≤ p a ∧ p a ≤ 1.'
  required: true
  status: implemented
  notes: ''
