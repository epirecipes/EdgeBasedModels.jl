- id: Hierarchy.R27
  group: Hierarchy
  source:
    file: EBCMCategory/Hierarchy.lean
    lines: 82-87
  text: '**Result 27.** For a two-moment record with mean κ, excess degree = mean forces variance = mean, so the record is the Poisson record `poisson κ` (`PGFData.dispersionIndex_eq_one_iff`). This does not make Poisson the unique degree distribution with excess degree = mean: ψ(u) = (1 + u²)/2 has ψ''''(1)/ψ''(1) = 1 = ψ''(1) and is not Poisson.'
  kind: structural
  impl:
  - poisson_unique_exact_lift
  supporting:
  - excess_degree_decomposition
  impl_note: 'impl: for ψ with ψ.mean = κ and ψ.excessDegree = κ, concludes ψ.variance = κ — not ψ = PGFData.poisson κ hκ. Within the two-moment record the stronger uniqueness would be provable, but for genuine degree distributions uniqueness is false: any non-Poisson law with variance = mean has excess degree = mean.'
  required: true
  status: implemented
  notes: 'Uniqueness is not what is proved. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result 27.** The Poisson lift is the UNIQUE PGF for which excess degree = mean (the exactness condition).'
- id: Hierarchy.R28
  group: Hierarchy
  source:
    file: EBCMCategory/Hierarchy.lean
    lines: 102-105
  text: '**Result 28.** Some PGF record with mean κ (the Poisson record) gives an edge model with R₀ = T·ψ''''(1)/ψ''(1). Matching the mean does not preserve R₀: the edge model of a record ψ has the node model''s R₀ T·κ iff ψ''''(1)/ψ''(1) = κ (`edge_lift_R0_eq_iff`).'
  kind: existence
  impl:
  - lift_space_parameterised
  supporting: []
  impl_note: 'impl: ∃ ψ, ψ.mean = κ ∧ (edgeModel p ψ).R0 = p.transmissibility * ψ.excessDegree, witnessed by Poisson. The second conjunct holds by definition for every ψ, so the theorem only asserts that a mean-κ PGFData exists; no parameterisation (a correspondence between lifts and mean-matching PGFs) is stated.'
  required: true
  status: implemented
  notes: 'Near-vacuous formalisation. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result 28.** The lift space is parameterised by PGFs with matching mean. -- Candidate impl: lift_space_parameterised ∧ edge_lift_R0_eq_iff.'
