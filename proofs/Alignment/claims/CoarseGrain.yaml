- id: CoarseGrain.R7
  group: CoarseGrain
  source:
    file: EBCMCategory/CoarseGrain.lean
    lines: 62-63
  text: '**Result 7.** The excess degree ratio decomposes as: ψ''''(1)/ψ''(1) = κ - 1 + σ²/κ'
  kind: algebraic-identity
  impl:
  - excess_degree_decomposition
  supporting: []
  impl_note: impl proves ψ.excessDegree = ψ.mean − 1 + ψ.dispersionIndex for every PGFData ψ (field identity using mean ≠ 0), with variance := secondFactorial + mean − mean² and dispersionIndex := variance/mean. ψ''(1), ψ'(1) are record fields, not derivatives of a PGF. Algebra checked with sympy.
  required: true
  status: implemented
  notes: PGFData admits unrealisable moment pairs (e.g. mean 2, secondFactorial 0 gives variance −2).
