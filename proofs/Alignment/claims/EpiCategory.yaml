- id: EpiCategory.R3
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 139-139
  text: '**Result 3.** The edge model always refines the node model.'
  kind: structural
  impl:
  - edge_refines_node
  supporting: []
  impl_note: 'impl proves nodeModel p ψ.mean ≤ edgeModel p ψ in the EpiModel preorder, which unfolds to the numeral inequality 3 ≤ 4 on the dim fields (proof: omega). R₀, p and ψ play no role; the node model is instantiated at κ = ψ.mean only.'
  required: true
  status: implemented
  notes: '''Refines'' is only ''has at least as many state variables''.'
- id: EpiCategory.R4
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 145-145
  text: '**Result 4.** For Poisson networks, both models compute the same R₀.'
  kind: algebraic-identity
  impl:
  - poisson_R0_agree
  supporting: []
  impl_note: impl proves (nodeModel p κ).R0 = (edgeModel p (PGFData.poisson κ hκ)).R0, i.e. T·κ = T·(κ²/κ). nodeModel's R₀ is defined as T·κ with T = β/(β+γ).
  required: true
  status: implemented
  notes: The 'node model' R₀ T·κ = βκ/(β+γ) is itself a network (Poisson-EBCM) quantity, not the R₀ of a mass-action SIR (βκ/γ with per-edge β); agreement is by construction of nodeModel.
