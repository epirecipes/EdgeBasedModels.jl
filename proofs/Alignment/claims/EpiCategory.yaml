- id: EpiCategory.header.twoCategories
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 6-11
  text: 'This file defines scalar records motivated by two informal classes of epidemic models; no categorical structure is formalised: * **Node** models: ODE systems on population-level state spaces (S, I, R) * **Edge** models: ODE systems on edge-probability state spaces (θ, φ, R), parameterised by a probability generating function (PGF)'
  kind: categorical
  impl: []
  supporting: []
  impl_note: 'No category (objects, morphisms, composition) is defined anywhere in the module. Both ''node'' and ''edge'' models are values of the single record EpiModel (dim : ℕ, R0 : ℚ); no ODE system, state space, or generating function appears.'
  required: false
  status: missing
  notes: 'Module-header claim. The only categorical structure is the Preorder instance on EpiModel (a thin category), shared by ''Node'' and ''Edge''. WP4b (TRIAGE P1.4/P2): text corrected; previous text: This file defines the two categories at the heart of the EBCM theory: * **Node**: ODE systems on population-level state spaces (S, I, R) * **Edge**: ODE systems on edge-probability state spaces (θ, φ, R), parameterised by a probability generating function (PGF)'
- id: EpiCategory.header.refinementPreorder
  group: EpiCategory
  source:
