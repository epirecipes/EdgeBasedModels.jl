    lines: 15-17
  text: The only order is the preorder `M₁ ≤ M₂ iff M₁.dim ≤ M₂.dim`; "refinement" below means "has at least as many state variables" and nothing more.
  kind: structural
  impl: []
  supporting: []
  impl_note: 'Definitional: the instance Preorder EpiModel orders models by their dim field (a proxy for ''structural information''); there is one preorder (not two) and no theorem; to be checked by a bridge.'
  required: false
  status: informal
  notes: 'Module-header claim about definitions. WP4b (TRIAGE P1.4/P2): text corrected; previous text: Both are formalised as preorders under a "refinement" relation: M₁ ≤ M₂ iff M₂ carries at least as much structural information as M₁.'
- id: EpiCategory.dispersionIndexOneIffPoisson
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 66-69
  text: 'Index of dispersion: σ²/κ. Poisson ⇒ dispersion index 1 (`poisson_dispersion_eq_one`). The converse is false for degree distributions: the law with P(0) = P(2) = 1/2, ψ(u) = (1 + u²)/2, has mean 1 and variance 1 but is not Poisson.'
  kind: equivalence
  impl: []
  supporting:
  - poisson_dispersion_eq_one
  - poisson_unique_exact_lift
  impl_note: Docstring of def PGFData.dispersionIndex. Only the direction Poisson ⇒ index 1 is proved (CoarseGrain Result 8, poisson_dispersion_eq_one). The converse is not stated anywhere; in the two-moment PGFData record it would say secondFactorial = mean² (which pins the record to PGFData.poisson), but for genuine degree distributions 'index 1 ⇒ Poisson' is false.
  required: false
  status: missing
  notes: 'Checkable claim attached to a def; the ''iff'' is not implemented. WP4b (TRIAGE P1.4/P2): text corrected; previous text: Index of dispersion: σ²/κ. Equals 1 iff Poisson. -- Record-level version now proved: PGFData.dispersionIndex_eq_one_iff (new claim EpiCategory.dispersionIndexEqOneIff).'
- id: EpiCategory.R1
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 54-54
  text: '**Result 1.** For Poisson, the excess degree equals the mean degree.'
  kind: algebraic-identity
  impl:
  - PGFData.poisson_excess_eq_mean
  supporting: []
  impl_note: impl proves (PGFData.poisson κ hκ).excessDegree = κ over ℚ for κ > 0. PGFData.poisson is a two-moment record (mean κ, secondFactorial κ²) and excessDegree is secondFactorial/mean, so this is the field identity κ²/κ = κ; no generating function exp(κ(z−1)) or derivative appears.
  required: true
  status: implemented
  notes: ''
- id: EpiCategory.R2
  group: EpiCategory
  source:
    file: EBCMCategory/EpiCategory.lean
    lines: 60-60
  text: '**Result 2.** For Poisson, the variance equals the mean (equidispersion).'
  kind: algebraic-identity
  impl:
  - PGFData.poisson_variance_eq_mean
  supporting: []
  impl_note: impl proves (PGFData.poisson κ hκ).variance = κ, i.e. the ring identity κ² + κ − κ² = κ, with variance defined from the two recorded moments rather than from a distribution.
  required: true
  status: implemented
  notes: ''
