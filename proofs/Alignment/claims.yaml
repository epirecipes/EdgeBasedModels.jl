    κ) ⇒ 4 (poisson_unique_exact_lift) are proved; 3 ⇔ 4 follows from excess_degree_decomposition but
    is not stated; item 1 is not formalised; 3 ⇒ 2 and 4 ⇒ 2 are false for genuine degree distributions
    and are only expressible in the two-moment PGFData record, where 'Poisson' collapses to secondFactorial
    = mean².
  required: true
  status: implemented
