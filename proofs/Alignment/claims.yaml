    not make Poisson the unique degree distribution with excess degree = mean: ψ(u) = (1 + u²)/2 has ψ''''(1)/ψ''(1)
    = 1 = ψ''(1) and is not Poisson.'
  kind: structural
  impl:
  - poisson_unique_exact_lift
  supporting:
  - excess_degree_decomposition
  impl_note: 'impl: for ψ with ψ.mean = κ and ψ.excessDegree = κ, concludes ψ.variance = κ — not ψ = PGFData.poisson
    κ hκ. Within the two-moment record the stronger uniqueness would be provable, but for genuine degree
    distributions uniqueness is false: any non-Poisson law with variance = mean has excess degree = mean.'
  required: true
  status: implemented
  notes: 'Uniqueness is not what is proved. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **Result
