    C₄ ∧ ∀ C₃, ¬ Equivariant M C₄.C C₃.C (witness MℝLin, F4Kℝ). IsKirkwoodForm C is only non-additivity
    (∃ u v, C(u+v) ≠ C u + C v). The text is UNIVERSAL over nontrivial Kirkwood-form families and generic
    M.'
  required: true
  status: implemented
  notes: 'MAJOR ALIGNMENT GAP (∃ vs ∀). Under the Lean predicate the universal reading is false: for any
    M with a linear section s and any nonlinear G, C₄ := s ∘ G ∘ M is non-additive yet equivariant with
    C₃ := G (e.g. M = id, C₄ = C₃ = u ↦ u²). WP4b (TRIAGE P1.4/P2): text corrected; previous text: T3
