- id: VolzMeyersEquations.massActionIncidence-a
  group: VolzMeyersEquations
  source:
    file: EBCMCategory/VolzMeyersEquations.lean
    lines: 206-212
  text: '**VM8.** For a homogeneous network with ψ(x) = x (every node has degree 1, κ=1), the VM model
    reduces to the standard SIR in the fast-mixing limit ρ → ∞. At ρ = 0 it describes isolated pairs,
    not mass action. In the fast-mixing limit: S = θ, P₁ = I, and the equations become dS/dt = −β·I·S,
    dI/dt = β·I·S − γ·I, dR/dt = γ·I.'
  kind: equivalence
  impl:
  - mass_action_incidence
  supporting: []
  impl_note: impl only checks incidence = I·S at the state ⟨S, I, 1 − I, I, I, 0⟩ with β = γ = κ = 1 and
    ρ = 0. No dS/dt is defined, dI/dR equations are not compared, 'any ρ' is instantiated only at ρ =
    0, and general β, γ are not covered.
  required: true
  status: implemented
  notes: 'Volz–Meyers (2007, §2b) derive the ψ(x) = x reduction only after the fast-mixing substitution
    P₁ = M₁ (ρ → ∞); on a static degree-1 network (ρ = 0: isolated pairs) the dynamics are not mass-action,
    so ''at any ρ'' is doubtful. WP4b (TRIAGE P1.4/P2): text corrected; previous text: **VM8.** For a
    homogeneous network with ψ(x) = x (every node has degree 1, κ=1), the VM model at any ρ reduces to
    the standard SIR. In this case: S = θ, P₁ = I, and the equations become dS/dt = −β·I·S, dI/dt = β·I·S
    − γ·I, dR/dt = γ·I.'
